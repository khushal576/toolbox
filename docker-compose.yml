# =============================================================================
# Toolbox — docker-compose.yml
# =============================================================================
# One service, one container: home page + every mounted tool (main.py).
#
# Usage:
#   Start:   docker-compose up --build -d
#   Stop:    docker-compose down
#   Logs:    docker-compose logs -f
#
# Open in browser: http://localhost:8000
# (8080 is deliberately avoided as the host port — commonly taken by other
# local services such as Jenkins.)
# =============================================================================

services:
  toolbox:
    build:
      context: .
      dockerfile: Dockerfile

    # Map host port 8000 → container port 8080.
    ports:
      - "8000:8080"

    # Restart the container automatically if it crashes.
    restart: unless-stopped

    # Lets the container reach services running on the HOST (not in this
    # compose file) via the stable name `host.docker.internal`, the same
    # name Docker Desktop provides automatically — on native Linux it
    # needs this explicit mapping. Added for Schema Map's "AI Assist"
    # initiative: an Ollama instance runs as its own separate container
    # (a different docker-compose project entirely, not part of this
    # one), reachable only via its host-published port. Without this,
    # the only working address was the bridge gateway IP (172.17.0.1 on
    # this host) — correct today, but an implementation detail of this
    # specific machine's Docker networking, not something to hardcode
    # into application code.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Environment variables available inside the container.
    # Add any future config here (e.g. LOG_LEVEL, MAX_PAYLOAD_MB).
    environment:
      - PYTHONUNBUFFERED=1
      - TOOLBOX_PLUGINS_DIR=/app/plugins

    # Optional: mount the ui/ folder so you can edit the frontend
    # without rebuilding the image.  Uncomment during development:
    # volumes:
    #   - ./ui:/app/ui:ro

    # Schema Map's Projects/Versions are stored in a SQLite file at
    # /app/data/schema-map/projects.db (see schema-map/project_store.py).
    # Without this, that file lives only in the container's writable
    # layer and every `docker-compose up --build` (a full recreate, not
    # just a restart) would silently wipe every project and its entire
    # version history. A named volume is Docker-managed storage that
    # survives image rebuilds and `docker-compose down` — only an
    # explicit `docker-compose down -v` removes it.
    # Vault's secrets (encrypted) and its encryption key are stored at
    # /app/data/vault/ (see core/vault.py). Same reasoning as
    # schema_map_data above — without this, every saved secret and the
    # key itself would be silently wiped on the next image rebuild,
    # which would also make any already-encrypted-but-now-orphaned rows
    # permanently undecryptable garbage even if the DB file somehow
    # survived without the key.
    # SSH & SFTP's transfer/command history and STAGED uploads live in /app/data/ssh-sftp/
    # (see ssh-sftp/state_store.py); staging is what lets a dropped upload resume.
    #
    # Data Dumper's dump FILES (can be large) and its catalogue live in /app/data/data-dumper/
    # (see data-dumper/state_store.py). Without this volume a rebuild would delete every dump.
    #
    # Schema Copy's projects, last-run results and generated .sql scripts live
    # in /app/data/schema-copy/ (see schema-copy/state_store.py) — same reasoning.
    #
    # Data Syncer's projects and per-table resume positions live in
    # /app/data/data-syncer/syncer.db (see data-syncer/state_store.py).
    # Without this volume a rebuild would erase every project AND the
    # saved position of every half-finished sync.
    volumes:
      - schema_map_data:/app/data/schema-map
      - vault_data:/app/data/vault
      - data_syncer_data:/app/data/data-syncer
      - schema_copy_data:/app/data/schema-copy
      - data_dumper_data:/app/data/data-dumper
      - ssh_sftp_data:/app/data/ssh-sftp
      # Workspace settings (which tools are on) — core_plugins/workspace.py, roadmap A3/A4.
      - workspace_data:/app/data/workspace
      # Custom apps (roadmap A5): static/external plugins, read-only; edit on the host, then restart.
      - ./plugins:/app/plugins:ro

volumes:
  schema_map_data:
  vault_data:
  data_syncer_data:
  schema_copy_data:
  data_dumper_data:
  ssh_sftp_data:
  workspace_data:
