# =============================================================================
# Toolbox — docker-compose.yml
# =============================================================================
# toolbox    = the GATEWAY (roadmap C2): workspace UI + proxy. Runs no tool code; forwards every /tools/<name>/
#              to the runtime image its manifest names. N uvicorn workers (TOOLBOX_WEB_WORKERS, default 4).
# rt-light / rt-data / rt-pgtools / rt-ssh / rt-latex
#            = runtime images (roadmap C1), each serving ONLY the tools of its `runtime:`.
# singletons = SQL Studio + Schema Map in ONE process (`singleton: true`, roadmap B9), data image.
# worker     = background jobs of every runtime (worker image, no TeX); redis/postgres/seaweedfs = state services.
#
# Usage:
#   Start:   docker-compose up --build -d
#   Stop:    docker-compose down
#   Logs:    docker-compose logs -f            (one tool's image: docker compose logs -f rt-data)
#
# Open in browser: http://localhost:8000
# (8080 is deliberately avoided as the host port — commonly taken by other
# local services such as Jenkins.)
# =============================================================================

# State services for every Toolbox container (roadmap B1, core/state/config.py). Defaults point at the bundled
# services below; set TOOLBOX_DATABASE_URL in a .env file to use an existing Postgres (own `toolbox` DB + user).
# TOOLBOX_VAULT_KEY (roadmap B7) comes from the git-ignored .env — NOT a data volume.
x-state-env: &state-env
  PYTHONUNBUFFERED: "1"
  TOOLBOX_DATABASE_URL: ${TOOLBOX_DATABASE_URL:-postgresql://toolbox:${TOOLBOX_DB_PASSWORD:-toolbox-local-only}@postgres:5432/toolbox}
  TOOLBOX_REDIS_URL: ${TOOLBOX_REDIS_URL:-redis://redis:6379/0}
  TOOLBOX_S3_ENDPOINT: ${TOOLBOX_S3_ENDPOINT:-http://seaweedfs:8333}
  TOOLBOX_S3_ACCESS_KEY: ${TOOLBOX_S3_ACCESS_KEY:-toolbox}
  TOOLBOX_S3_SECRET_KEY: ${TOOLBOX_S3_SECRET_KEY:-toolbox-local-only-secret}
  TOOLBOX_S3_BUCKET: ${TOOLBOX_S3_BUCKET:-toolbox}
  TOOLBOX_VAULT_KEY: ${TOOLBOX_VAULT_KEY:-}

# Tool containers: restart on crash, reach services on the HOST as `host.docker.internal` (Docker Desktop does
# this by itself; native Linux needs the mapping — e.g. a host Postgres, or Schema Map's Ollama), and report
# health on /healthz.
x-tool-service: &tool-service
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
    interval: 15s
    timeout: 5s
    retries: 3
  depends_on:
    redis:
      condition: service_started
    postgres:
      condition: service_started
    seaweedfs:
      condition: service_started

services:
  # ---------------------------------------------------------------------------
  # Gateway (roadmap C2) — the only service on a host port.
  # ---------------------------------------------------------------------------
  toolbox:
    <<: *tool-service
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    image: toolbox-gateway
    ports:
      - "8000:8080"
    command: ["sh", "-c", "exec uvicorn main:app --host 0.0.0.0 --port 8080 --workers $${TOOLBOX_WEB_WORKERS:-4}"]
    environment:
      <<: *state-env
      TOOLBOX_PLUGINS_DIR: /app/plugins
      TOOLBOX_WEB_WORKERS: ${TOOLBOX_WEB_WORKERS:-4}
      # where each manifest `runtime:` is served (roadmap C2); singletons separately (roadmap B9)
      TOOLBOX_RUNTIME_URLS: light=http://rt-light:8080,data=http://rt-data:8080,pgtools=http://rt-pgtools:8080,ssh=http://rt-ssh:8080,latex=http://rt-latex:8080
      TOOLBOX_SINGLETON_URL: http://singletons:8080
      # roadmap C3: start/stop on-demand runtimes (tier-4 ones: latex, pgtools, ssh) through the docker-proxy
      TOOLBOX_DOCKER_URL: http://docker-proxy:2375
      # empty = each runtime's manifest scaling.idle_timeout_s (900 s); set it in .env/shell to override (testing)
      TOOLBOX_IDLE_TIMEOUT_S: ${TOOLBOX_IDLE_TIMEOUT_S:-}
    volumes:
      # Workspace settings (which tools are on) — core_plugins/workspace.py, roadmap A3/A4. Shared read-only
      # with the tool containers so a turned-off tool is off everywhere.
      - workspace_data:/app/data/workspace
      # Custom apps (roadmap A5): static/external plugins, read-only; edit on the host, then restart.
      - ./plugins:/app/plugins:ro
    depends_on:
      redis:
        condition: service_started
      rt-light:
        condition: service_started
      rt-data:
        condition: service_started
      rt-pgtools:
        condition: service_started
      rt-ssh:
        condition: service_started
      rt-latex:
        condition: service_started
      singletons:
        condition: service_started
      docker-proxy:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Docker access for the gateway's on-demand supervisor (roadmap C3) — and NOTHING else. docker-socket-proxy
  # (HAProxy) with our own rule set instead of its env switches: those can only allow start/stop together with
  # ALL container POSTs (create, exec, update…). Allowed: GET /_ping, /version, /containers/json, /containers/<x>/json;
  # POST start/stop ONLY of containers named `<project>-rt-<runtime>-<n>`. The socket is mounted read-only here
  # and nowhere else. Not published.
  # ---------------------------------------------------------------------------
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: docker_proxy_rules
        target: /usr/local/etc/haproxy/haproxy.cfg.template

  # ---------------------------------------------------------------------------
  # Runtime images (roadmap C1) — one per manifest `runtime:`, each mounting ONLY its own python plugins
  # (TOOLBOX_ROLE=runtime is baked into the image). Not published: the gateway proxies to them. Their local
  # folders under /app/data are caches only — the real state is in Postgres / Redis / S3 storage (phase B).
  # Debug one directly: docker compose exec rt-data curl -s localhost:8080/api/workspace/status
  # ---------------------------------------------------------------------------
  rt-light:
    <<: *tool-service
    build: {context: ., target: light}
    image: toolbox-rt-light
    environment: *state-env
    volumes:
      - workspace_data:/app/data/workspace:ro

  rt-data:
    <<: *tool-service
    build: {context: ., target: data}
    image: toolbox-rt-data
    environment:
      <<: *state-env
      # 2 processes: DataDiff/pandas work is CPU-bound; every tool here keeps its state outside the process
      TOOLBOX_WEB_WORKERS: ${TOOLBOX_DATA_WORKERS:-2}
    volumes:
      - workspace_data:/app/data/workspace:ro
      # legacy files (one-time migration sources, B6/B7 — already migrated here; harmless afterwards)
      - vault_data:/app/data/vault
      - data_syncer_data:/app/data/data-syncer

  # On-demand (roadmap C3): pgtools, ssh and latex hold only tier-4 tools, so the gateway starts them on first use
  # and stops them after scaling.idle_timeout_s. Limits = the sum of their plugins' manifest `resources`
  # (tests/unit/test_runtimes.py keeps them equal). `docker compose up -d` starts them; the gateway puts them to sleep.
  rt-pgtools:
    <<: *tool-service
    mem_limit: 1024m
    cpus: 2.0
    build: {context: ., target: pgtools}
    image: toolbox-rt-pgtools
    environment: *state-env
    volumes:
      - workspace_data:/app/data/workspace:ro
      - schema_copy_data:/app/data/schema-copy    # legacy SQLite + local file cache
      - data_dumper_data:/app/data/data-dumper

  rt-ssh:
    <<: *tool-service
    mem_limit: 512m
    cpus: 1.0
    build: {context: ., target: ssh}
    image: toolbox-rt-ssh
    environment: *state-env
    volumes:
      - workspace_data:/app/data/workspace:ro
      - ssh_sftp_data:/app/data/ssh-sftp          # legacy SQLite + local stage cache

  rt-latex:
    <<: *tool-service
    mem_limit: 1024m
    cpus: 2.0
    build: {context: ., target: latex}
    image: toolbox-rt-latex
    environment: *state-env
    volumes:
      - workspace_data:/app/data/workspace:ro

  # ---------------------------------------------------------------------------
  # Singleton tools (roadmap B9): SQL Studio and Schema Map each hold ONE live database pool and never store the
  # password (owner decision, B3), so they run in exactly one process — the data image with
  # TOOLBOX_ROLE=singletons (mounts only `singleton: true` plugins). Never scale this service.
  # ---------------------------------------------------------------------------
  singletons:
    <<: *tool-service
    image: toolbox-rt-data
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
    environment:
      <<: *state-env
      TOOLBOX_ROLE: singletons
    volumes:
      - schema_map_data:/app/data/schema-map   # legacy SQLite (one-time migration source, B6)
      - vault_data:/app/data/vault
      - workspace_data:/app/data/workspace:ro
    depends_on:
      rt-data:
        condition: service_started   # builds/tags the toolbox-rt-data image first
      redis:
        condition: service_started
      postgres:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Job worker (roadmap B4, core/jobs): long jobs from the Redis queue (syncs, dumps/restores, schema copies,
  # SSH uploads/commands), so a web restart never kills them. Worker image: jobs of every runtime run here.
  # Scale with --scale worker=N. Also the place for the headless CLI:
  #   docker compose exec worker python -m orchestrator.cli ...
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker       # all packages + pg_dump, no TeX Live (roadmap C4)
    image: toolbox-worker
    command: ["python", "-m", "core.jobs.worker"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *state-env
    volumes:
      # Legacy SQLite files/key (one-time migration sources since B6/B7) and local file caches.
      - vault_data:/app/data/vault
      - data_syncer_data:/app/data/data-syncer
      - schema_copy_data:/app/data/schema-copy
      - data_dumper_data:/app/data/data-dumper
      - ssh_sftp_data:/app/data/ssh-sftp
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # State services (roadmap B1 — ADR-001). Not published on host ports: reachable only from the toolbox
  # container over the compose network. Data lives in named volumes (survive rebuilds; only `down -v` deletes).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    # AOF persistence so a restart keeps queued jobs; noeviction so queues are never silently dropped.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    # Same major as the bundled pg_dump/psql (Dockerfile stage `pgclient`). Toolbox's OWN records only.
    image: postgres:18-bookworm
    environment:
      - POSTGRES_DB=toolbox
      - POSTGRES_USER=toolbox
      - POSTGRES_PASSWORD=${TOOLBOX_DB_PASSWORD:-toolbox-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql   # PG 18 images keep data under /var/lib/postgresql/18/docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbox -d toolbox"]
      interval: 10s
      timeout: 3s
      retries: 5

  seaweedfs:
    # S3-compatible object storage (MinIO community images were discontinued in 2025). One process:
    # master + volume + filer + S3 gateway. Swappable for Garage/AWS S3 via TOOLBOX_S3_* only.
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json",
              "-master.volumeSizeLimitMB=1024", "-volume.max=0"]
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped
    # The S3 gateway binds the container IP (not localhost) and needs ~20 s to start (raft leader election).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://$$(hostname -i | cut -d' ' -f1):8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

configs:
  docker_proxy_rules:
    # HAProxy config for docker-proxy (see the service). $$ = a literal $ in compose files.
    content: |
      global
          log stdout format raw daemon info
          maxconn 200
      defaults
          mode http
          log global
          option httplog
          option dontlognull
          option http-server-close
          timeout http-request 10s
          timeout connect 10s
          timeout client 2m
          timeout server 2m
      backend dockerbackend
          server dockersocket /var/run/docker.sock
      frontend dockerfrontend
          bind :2375
          http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/(_ping|version)$$ }
          http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$$ }
          http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/json$$ }
          http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+-rt-[a-z]+-[0-9]+/(start|stop)$$ }
          http-request deny
          default_backend dockerbackend
  seaweedfs_s3:
    content: |
      {"identities": [{"name": "toolbox",
        "credentials": [{"accessKey": "${TOOLBOX_S3_ACCESS_KEY:-toolbox}",
                         "secretKey": "${TOOLBOX_S3_SECRET_KEY:-toolbox-local-only-secret}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

volumes:
  schema_map_data:
  vault_data:
  data_syncer_data:
  schema_copy_data:
  data_dumper_data:
  ssh_sftp_data:
  workspace_data:
  redis_data:
  postgres_data:
  seaweedfs_data:
