# =============================================================================
# Toolbox — docker-compose.yml
# =============================================================================
# One service, one container: home page + every mounted tool (main.py).
#
# Usage:
#   Start:   docker-compose up --build -d
#   Stop:    docker-compose down
#   Logs:    docker-compose logs -f
#
# Open in browser: http://localhost:8000
# (8080 is deliberately avoided as the host port — commonly taken by other
# local services such as Jenkins.)
# =============================================================================

services:
  toolbox:
    build:
      context: .
      dockerfile: Dockerfile

    # Map host port 8000 → container port 8080.
    ports:
      - "8000:8080"

    # Restart the container automatically if it crashes.
    restart: unless-stopped

    # Lets the container reach services running on the HOST (not in this
    # compose file) via the stable name `host.docker.internal`, the same
    # name Docker Desktop provides automatically — on native Linux it
    # needs this explicit mapping. Added for Schema Map's "AI Assist"
    # initiative: an Ollama instance runs as its own separate container
    # (a different docker-compose project entirely, not part of this
    # one), reachable only via its host-published port. Without this,
    # the only working address was the bridge gateway IP (172.17.0.1 on
    # this host) — correct today, but an implementation detail of this
    # specific machine's Docker networking, not something to hardcode
    # into application code.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Start order only — Toolbox still starts if a state service is down (tools that don't use state keep
    # working; GET /api/state/health reports the problem).
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      seaweedfs:
        condition: service_started

    # Environment variables available inside the container.
    # Add any future config here (e.g. LOG_LEVEL, MAX_PAYLOAD_MB).
    environment:
      - PYTHONUNBUFFERED=1
      - TOOLBOX_PLUGINS_DIR=/app/plugins
      # State services (roadmap B1, core/state/config.py). Defaults point at the bundled services below;
      # set TOOLBOX_DATABASE_URL in a .env file to use an existing Postgres instead (own `toolbox` DB + user).
      - TOOLBOX_DATABASE_URL=${TOOLBOX_DATABASE_URL:-postgresql://toolbox:${TOOLBOX_DB_PASSWORD:-toolbox-local-only}@postgres:5432/toolbox}
      - TOOLBOX_REDIS_URL=${TOOLBOX_REDIS_URL:-redis://redis:6379/0}
      - TOOLBOX_S3_ENDPOINT=${TOOLBOX_S3_ENDPOINT:-http://seaweedfs:8333}
      - TOOLBOX_S3_ACCESS_KEY=${TOOLBOX_S3_ACCESS_KEY:-toolbox}
      - TOOLBOX_S3_SECRET_KEY=${TOOLBOX_S3_SECRET_KEY:-toolbox-local-only-secret}
      - TOOLBOX_S3_BUCKET=${TOOLBOX_S3_BUCKET:-toolbox}

    # Optional: mount the ui/ folder so you can edit the frontend
    # without rebuilding the image.  Uncomment during development:
    # volumes:
    #   - ./ui:/app/ui:ro

    # Schema Map's Projects/Versions are stored in a SQLite file at
    # /app/data/schema-map/projects.db (see schema-map/project_store.py).
    # Without this, that file lives only in the container's writable
    # layer and every `docker-compose up --build` (a full recreate, not
    # just a restart) would silently wipe every project and its entire
    # version history. A named volume is Docker-managed storage that
    # survives image rebuilds and `docker-compose down` — only an
    # explicit `docker-compose down -v` removes it.
    # Vault's secrets (encrypted) and its encryption key are stored at
    # /app/data/vault/ (see core/vault.py). Same reasoning as
    # schema_map_data above — without this, every saved secret and the
    # key itself would be silently wiped on the next image rebuild,
    # which would also make any already-encrypted-but-now-orphaned rows
    # permanently undecryptable garbage even if the DB file somehow
    # survived without the key.
    # SSH & SFTP's transfer/command history and STAGED uploads live in /app/data/ssh-sftp/
    # (see ssh-sftp/state_store.py); staging is what lets a dropped upload resume.
    #
    # Data Dumper's dump FILES (can be large) and its catalogue live in /app/data/data-dumper/
    # (see data-dumper/state_store.py). Without this volume a rebuild would delete every dump.
    #
    # Schema Copy's projects, last-run results and generated .sql scripts live
    # in /app/data/schema-copy/ (see schema-copy/state_store.py) — same reasoning.
    #
    # Data Syncer's projects and per-table resume positions live in
    # /app/data/data-syncer/syncer.db (see data-syncer/state_store.py).
    # Without this volume a rebuild would erase every project AND the
    # saved position of every half-finished sync.
    volumes:
      - schema_map_data:/app/data/schema-map
      - vault_data:/app/data/vault
      - data_syncer_data:/app/data/data-syncer
      - schema_copy_data:/app/data/schema-copy
      - data_dumper_data:/app/data/data-dumper
      - ssh_sftp_data:/app/data/ssh-sftp
      # Workspace settings (which tools are on) — core_plugins/workspace.py, roadmap A3/A4.
      - workspace_data:/app/data/workspace
      # Custom apps (roadmap A5): static/external plugins, read-only; edit on the host, then restart.
      - ./plugins:/app/plugins:ro

  # ---------------------------------------------------------------------------
  # Job worker (roadmap B4, core/jobs): runs long jobs (Data Syncer runs today; dumps/transfers in B5/B8) from the
  # Redis queue, so a web restart never kills them. Same image as `toolbox`; scale with --scale worker=N.
  # Needs the same env, host access and data volumes as the web app because jobs use the same tool code.
  # ---------------------------------------------------------------------------
  worker:
    image: toolbox-toolbox
    command: ["python", "-m", "core.jobs.worker"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - TOOLBOX_DATABASE_URL=${TOOLBOX_DATABASE_URL:-postgresql://toolbox:${TOOLBOX_DB_PASSWORD:-toolbox-local-only}@postgres:5432/toolbox}
      - TOOLBOX_REDIS_URL=${TOOLBOX_REDIS_URL:-redis://redis:6379/0}
      - TOOLBOX_S3_ENDPOINT=${TOOLBOX_S3_ENDPOINT:-http://seaweedfs:8333}
      - TOOLBOX_S3_ACCESS_KEY=${TOOLBOX_S3_ACCESS_KEY:-toolbox}
      - TOOLBOX_S3_SECRET_KEY=${TOOLBOX_S3_SECRET_KEY:-toolbox-local-only-secret}
      - TOOLBOX_S3_BUCKET=${TOOLBOX_S3_BUCKET:-toolbox}
    volumes:
      # Until B6/B7 move them to Postgres: the SQLite stores and the Vault the jobs read/write.
      - vault_data:/app/data/vault
      - data_syncer_data:/app/data/data-syncer
      - schema_copy_data:/app/data/schema-copy
      - data_dumper_data:/app/data/data-dumper
      - ssh_sftp_data:/app/data/ssh-sftp
    depends_on:
      toolbox:
        condition: service_started
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # State services (roadmap B1 — ADR-001). Not published on host ports: reachable only from the toolbox
  # container over the compose network. Data lives in named volumes (survive rebuilds; only `down -v` deletes).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    # AOF persistence so a restart keeps queued jobs; noeviction so queues are never silently dropped.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    # Same major as the bundled pg_dump/psql (Dockerfile stage `pgclient`). Toolbox's OWN records only.
    image: postgres:18-bookworm
    environment:
      - POSTGRES_DB=toolbox
      - POSTGRES_USER=toolbox
      - POSTGRES_PASSWORD=${TOOLBOX_DB_PASSWORD:-toolbox-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql   # PG 18 images keep data under /var/lib/postgresql/18/docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbox -d toolbox"]
      interval: 10s
      timeout: 3s
      retries: 5

  seaweedfs:
    # S3-compatible object storage (MinIO community images were discontinued in 2025). One process:
    # master + volume + filer + S3 gateway. Swappable for Garage/AWS S3 via TOOLBOX_S3_* only.
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json",
              "-master.volumeSizeLimitMB=1024", "-volume.max=0"]
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped
    # The S3 gateway binds the container IP (not localhost) and needs ~20 s to start (raft leader election).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://$$(hostname -i | cut -d' ' -f1):8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

configs:
  seaweedfs_s3:
    content: |
      {"identities": [{"name": "toolbox",
        "credentials": [{"accessKey": "${TOOLBOX_S3_ACCESS_KEY:-toolbox}",
                         "secretKey": "${TOOLBOX_S3_SECRET_KEY:-toolbox-local-only-secret}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

volumes:
  schema_map_data:
  vault_data:
  data_syncer_data:
  schema_copy_data:
  data_dumper_data:
  ssh_sftp_data:
  workspace_data:
  redis_data:
  postgres_data:
  seaweedfs_data:
