# =============================================================================
# registry.yaml
# =============================================================================
# The list of tools shown as cards on the Toolbox home page ("/").
#
# This is display metadata only — it does NOT wire up the routing. To
# actually add a tool you still need one `app.mount(...)` line in main.py
# (see main.py's docstring). This file just controls what shows up on the
# home page and what each card says.
#
# `category` is either "tool" (does real practical work — the home page
# shows these by default) or "learn" (educational/reference, doesn't act on
# real data — hidden by default, shown via the "Show learning tools" toggle).
# Missing category defaults to "tool" (see main.py's _render_card). When in
# doubt: if using it produces a result you'd actually act on outside this
# site, it's a tool; if it only explains or demonstrates a concept, it's
# learn.
# =============================================================================

tools:
  - name: datadiff-pro
    title: "DataDiff Pro"
    description: "Deep smart diff for JSON, XML & CSV — nested objects, list keys, equivalence rules"
    icon: "🔍"
    category: tool

  - name: encode-decode
    title: "Encode/Decode"
    description: "Base64, URL, Hex, HTML entities, Gzip, AES, RSA, JWT, hashing — all client-side, nothing leaves your browser"
    icon: "🔐"
    category: tool

  - name: subnet-calc
    title: "Subnet Calculator"
    description: "Interactive IPv4 subnetting — binary bit visualization and a worked explanation for every answer"
    icon: "🧮"
    category: tool

  - name: dns-lookup
    title: "DNS Lookup"
    description: "Live DNS records for any domain — 14 record types (A through SSHFP), with a plain-language explanation of what each one means"
    icon: "🌐"
    category: tool

  - name: vlan-designer
    title: "VLAN Designer"
    description: "Design VLANs, switch ports, and inter-VLAN routing — see exactly why two devices can or can't reach each other"
    icon: "🧩"
    category: learn

  - name: packet-journey
    title: "Packet Journey"
    description: "One real HTTP request, traced layer by layer — what gets added, what it's called, and what it actually looks like"
    icon: "📦"
    category: learn

  - name: curl-builder
    title: "cURL Builder"
    description: "Build complex curl commands from a form — method, auth, headers, body, cookies, flags — copy-pasteable for bash, cmd.exe, or PowerShell"
    icon: "⌨️"
    category: tool

  - name: header-reference
    title: "HTTP Header Reference"
    description: "Browsable, categorized glossary of ~90 widely-used HTTP headers — what each one means, an example, and which category it belongs to"
    icon: "📖"
    category: learn

  - name: http-methods-status
    title: "HTTP Methods & Status Codes"
    description: "Every HTTP method and status code — plain-word meaning, multiple real examples, edge cases, and an architect's decision guide for which one to return"
    icon: "🧭"
    category: learn

  - name: cookie-lab
    title: "Cookie Lab"
    description: "A live document.cookie playground plus full theory — design, set, inspect, and delete real cookies while seeing every attribute, edge case, and browser rejection explained"
    icon: "🍪"
    category: learn

  - name: df-studio
    title: "DataFrame Studio"
    description: "Click-driven pandas — load CSV/JSON/XML/Parquet, transform with UI steps or custom Python, export as a file or a standalone script, save reusable templates"
    icon: "🐼"
    category: tool

  - name: sql-studio
    title: "SQL Studio"
    description: "Paste, edit, and pretty-print Postgres SQL — 125+ templates, live Run (optionally via SSH tunnel) against a real database, save/load connections via Vault, and psql-style show commands"
    icon: "🗄️"
    category: tool

  - name: schema-map
    title: "Schema Map"
    description: "Connect to a Postgres database (optionally via SSH tunnel) and see its tables and foreign-key structure as an explorable graph — built for large, poorly-documented legacy schemas"
    icon: "🗺️"
    category: tool

  - name: duck-lab
    title: "Duck Lab"
    description: "Load CSV/JSON/Parquet/XML files and join or analyze them with SQL (DuckDB) — schema-aware autocomplete, table preview, paginated results so a big join never floods the page"
    icon: "🦆"
    category: tool

  - name: vault
    title: "Vault"
    description: "Shared encrypted secret store — save DB connections (and anything else) from any tool so you stop retyping credentials after every disconnect"
    icon: "🔒"
    category: tool
