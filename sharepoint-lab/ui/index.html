<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SharePoint Lists</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f6fb; --surface: #ffffff; --border: #dde1ef;
    --text: #1c2035; --muted: #6b7180; --accent: #4f5ef0;
    --ok: #15803d; --err: #b91c1c; --warn: #b45309;
    --stage: #fff7d6; --stage-b: #f0c94a; --old: #fde8e8; --new: #e3f6e8;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; display: flex; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .ib { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 30px; height: 30px; padding: 0 7px; border: 1px solid transparent; border-radius: 7px;
        background: none; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .ib:hover { background: #e9ecf8; color: var(--text); }
  .ib.on { background: #e5e8ff; color: var(--accent); }
  .ib.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ib.primary:hover { background: #4250dc; }
  .ib.danger { background: var(--err); color: #fff; border-color: var(--err); }
  .ib:disabled { opacity: 0.45; cursor: default; pointer-events: none; }
  .badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--stage-b); color: #5b4300; font-size: 0.72rem; font-weight: 700; text-align: center; line-height: 17px; }
  .chip { display: inline-block; padding: 0 7px; border-radius: 9px; background: #e8ebf8; font-size: 0.74rem; line-height: 18px; margin-right: 3px; white-space: nowrap; }
  .chip.ro { background: #ffe9c7; color: #7a4a00; }

  /* sidebar */
  #side { width: 290px; min-width: 200px; max-width: 520px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex: none; }
  body.collapsed #side, body.collapsed #resizer { display: none; }
  #sideHead { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--border); font-weight: 700; }
  #sideHead span { flex: 1; letter-spacing: -0.2px; }
  #tree { flex: 1; overflow: auto; padding: 6px 4px 20px; }
  .node { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 6px; cursor: pointer; min-height: 28px; }
  .node:hover { background: #eef0fb; }
  .node.active { background: #e5e8ff; font-weight: 600; }
  .node .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .car { width: 14px; color: var(--muted); transition: transform 0.1s; }
  .node .car.open { transform: rotate(90deg); }
  .node .acts { display: none; gap: 0; }
  .node:hover .acts { display: inline-flex; }
  .lvl1 { margin-left: 14px; } .lvl2 { margin-left: 30px; }
  .err { color: var(--err); font-size: 0.78rem; padding: 2px 8px 4px 40px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9cde0; flex: none; }
  .dot.ok { background: #2fb457; } .dot.warn { background: #e0a100; }
  #resizer { width: 5px; cursor: col-resize; background: transparent; flex: none; margin-left: -3px; z-index: 2; }
  #resizer:hover { background: #c8ceef; }

  /* main */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #tabs { display: flex; align-items: stretch; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; scrollbar-width: thin; }
  #tabs .lead { display: flex; align-items: center; padding: 0 4px 0 6px; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; height: 36px; cursor: pointer; border-left: 1px solid var(--border); color: var(--muted); white-space: nowrap; max-width: 260px; }
  .tab .tt { overflow: hidden; text-overflow: ellipsis; }
  .tab.active { color: var(--text); background: var(--bg); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
  .tab .x { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
  .tab .x:hover { background: var(--border); }
  #bar { display: flex; align-items: center; gap: 2px; padding: 4px 8px; background: var(--surface); border-bottom: 1px solid var(--border); flex: none; flex-wrap: wrap; }
  #bar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  #bar input[type=search] { border: 1px solid var(--border); border-radius: 7px; padding: 4px 8px; width: 220px; background: var(--bg); }
  #bar .grow { flex: 1; }
  #stage { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  #empty { margin: auto; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #empty svg { width: 46px; height: 46px; stroke-width: 1.2; }
  #gridWrap { flex: 1; min-height: 0; overflow: auto; background: var(--surface); }
  table.grid { border-collapse: separate; border-spacing: 0; min-width: 100%; }
  .grid th { position: sticky; top: 0; z-index: 2; background: #f8f9fd; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0; text-align: left; font-weight: 600; white-space: nowrap; }
  .grid th .hd { display: flex; align-items: center; gap: 5px; padding: 6px 8px; cursor: pointer; user-select: none; }
  .grid th .ty { font-weight: 400; color: var(--muted); font-size: 0.68rem; }
  .grid th.ro .hd { color: var(--muted); }
  .grid td { border-bottom: 1px solid #edeff8; border-right: 1px solid #f1f2fa; padding: 0 8px; height: 28px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; }
  .grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .grid td.id, .grid th.id { position: sticky; left: 0; z-index: 1; background: #f8f9fd; color: var(--muted); width: 54px; min-width: 54px; text-align: right; }
  .grid th.id { z-index: 3; }
  .grid tr:hover td { background: #f6f7fe; }
  .grid tr:hover td.id { background: #eef0fb; }
  .grid td.edit { cursor: cell; }
  .grid td.staged { background: var(--stage) !important; box-shadow: inset 0 0 0 1px var(--stage-b); }
  .grid td.bad { box-shadow: inset 0 0 0 2px var(--err); }
  .grid tr.draft td.id::after { content: "new"; color: var(--accent); font-size: 0.66rem; }
  .grid td input, .grid td select, .grid td textarea { position: absolute; inset: 0; width: 100%; height: 100%; border: 2px solid var(--accent); border-radius: 0; padding: 0 6px; background: #fff; outline: none; }
  .grid td textarea { height: 120px; z-index: 5; padding: 6px; resize: vertical; box-shadow: 0 8px 22px rgba(0,0,0,.18); }
  .grid td .pop { position: absolute; top: 100%; left: 0; z-index: 6; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.18); padding: 6px; min-width: 140px; }
  .grid td .pop label { display: flex; gap: 6px; padding: 3px 6px; cursor: pointer; border-radius: 5px; }
  .grid td .pop label:hover { background: var(--bg); }
  .grid td .undo { position: absolute; right: 2px; top: 3px; display: none; background: #fff; border: 1px solid var(--stage-b); border-radius: 5px; height: 20px; width: 20px; align-items: center; justify-content: center; cursor: pointer; }
  .grid td.staged:hover .undo { display: flex; }
  .muted { color: var(--muted); }
  .bool { font-size: 1rem; line-height: 1; }
  #status { flex: none; display: flex; gap: 14px; align-items: center; padding: 3px 12px; background: var(--surface); border-top: 1px solid var(--border); font-size: 0.74rem; color: var(--muted); }
  #status b { color: var(--text); font-weight: 600; }

  /* dialogs */
  dialog { border: 0; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); padding: 0; width: min(820px, 94vw); max-height: 90vh; color: var(--text); background: var(--surface); margin: auto; }
  dialog::backdrop { background: rgba(20,24,45,.45); }
  dialog[open] { display: flex; flex-direction: column; }
  .dh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 0.95rem; }
  .dh .grow { flex: 1; }
  .db { padding: 12px 14px; overflow: auto; flex: 1; }
  .df { display: flex; gap: 6px; align-items: center; justify-content: flex-end; padding: 8px 14px; border-top: 1px solid var(--border); background: #f8f9fd; }
  .df .grow { flex: 1; color: var(--muted); font-size: 0.8rem; }
  .form { display: grid; grid-template-columns: 120px 1fr; gap: 8px 10px; align-items: center; }
  .form label.l { color: var(--muted); }
  .form input[type=text], .form input[type=password], .form select, .form textarea { width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; background: #fff; }
  .form textarea { min-height: 80px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 5px 12px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .code { font: 700 1.9rem ui-monospace, Menlo, Consolas, monospace; letter-spacing: 4px; text-align: center; padding: 14px; background: var(--bg); border-radius: 10px; user-select: all; }
  table.t { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
  table.t th, table.t td { border-bottom: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; }
  table.t th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: #fff; }
  .rv { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .rv .rh { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #f8f9fd; font-weight: 600; }
  .rv .rh .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rv.bad { border-color: #e9b3b3; } .rv.conflict { border-color: #f0c94a; } .rv.ok { border-color: #a7dcb6; }
  .ov { white-space: pre-wrap; word-break: break-word; padding: 2px 6px; border-radius: 5px; display: inline-block; max-width: 100%; }
  .ov.old { background: var(--old); text-decoration: line-through; text-decoration-color: #b91c1c88; }
  .ov.new { background: var(--new); }
  .ov.live { background: #fff1c2; }
  .arrow { color: var(--muted); padding: 0 6px; }
  .msg { padding: 4px 10px 8px; color: var(--err); font-size: 0.8rem; }
  .msg.warn { color: var(--warn); } .msg.good { color: var(--ok); }
  #toast { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); background: #1c2035; color: #fff; padding: 7px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100; max-width: 80vw; }
  #toast.show { opacity: .96; } #toast.err { background: #8f1d1d; }
</style>
</head>
<body>
<aside id="side">
  <div id="sideHead"><span>SharePoint</span>
    <button class="ib" id="btnAddConn" title="Add a connection"></button>
    <button class="ib" id="btnHide" title="Hide the sidebar (Ctrl+B)"></button>
  </div>
  <div id="tree"></div>
</aside>
<div id="resizer"></div>
<section id="main">
  <div id="tabs"><span class="lead"><button class="ib" id="btnShow" title="Show the sidebar (Ctrl+B)" hidden></button></span><span id="tabList" style="display:flex"></span></div>
  <div id="bar" hidden>
    <button class="ib" id="btnReload" title="Reload this list"></button>
    <input type="search" id="filter" placeholder="Filter loaded rows" />
    <span class="sep"></span>
    <button class="ib" id="btnSystem" title="Show system and hidden columns"></button>
    <button class="ib" id="btnSchema" title="All columns — names, types, choices"></button>
    <button class="ib" id="btnAddRow" title="Add a new item (staged until you approve)"></button>
    <button class="ib" id="btnCsv" title="Download the whole list as CSV"></button>
    <button class="ib" id="btnAudit" title="What was written, and when"></button>
    <span class="grow"></span>
    <button class="ib" id="btnReview" title="Review staged changes and approve them"></button>
  </div>
  <div id="stage">
    <div id="empty"><div id="emptyIcon"></div><div>Add a connection, then open a list</div></div>
    <div id="gridWrap" hidden></div>
  </div>
  <div id="status" hidden></div>
</section>
<div id="toast"></div>

<dialog id="dlgConn"></dialog>
<dialog id="dlgSignin"></dialog>
<dialog id="dlgSchema"></dialog>
<dialog id="dlgReview"></dialog>
<dialog id="dlgAudit"></dialog>

<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = (id) => document.getElementById(id);
const P = { // inline icons (stroke), 24-box paths
  plus: "M12 5v14M5 12h14", refresh: "M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7", panel: "M3 4h18v16H3zM9 4v16", x: "M6 6l12 12M18 6L6 18",
  list: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01", cols: "M3 4h18v16H3zM9 4v16M15 4v16", eye: "M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",
  schema: "M4 5h16M4 10h16M4 15h10M4 20h6", dl: "M12 4v11M7 11l5 5 5-5M5 20h14", clock: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2",
  check: "M5 12l5 5 9-10", key: "M14 10a4 4 0 1 1-3.5 6L4 22v-3h-2v-2h2v-2l4.5-4.5A4 4 0 0 1 14 10z", edit: "M4 20h4L19 9l-4-4L4 16zM13 7l4 4",
  undo: "M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3", caret: "M9 6l6 6-6 6", site: "M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z",
  review: "M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9", sheet: "M4 4h16v16H4zM4 10h16M4 15h16M10 4v16",
};
const icon = (n) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "i");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", P[n]); s.appendChild(p); return s; };
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v; else if (k in e && typeof v !== "string") e[k] = v; else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };
let toastT;
function toast(msg, err) { const t = $("toast"); t.textContent = msg; t.className = "show" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(() => (t.className = ""), err ? 6000 : 2600); }
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : undefined, body: body ? JSON.stringify(body) : undefined });
  const text = await r.text();
  let j = null; try { j = JSON.parse(text); } catch (e) { /* not JSON */ }
  if (!r.ok) { const err = new Error((j && j.detail) || `Request failed (${r.status})`); err.status = r.status; err.needsSignin = !!(j && j.needs_signin); throw err; }
  return j;
}
const fill = (el, ...kids) => el.replaceChildren(...kids.flat().filter((k) => k != null && k !== false));   // replaceChildren(null) would insert the text "null"
const qs = (o) => "?" + new URLSearchParams(Object.entries(o).filter(([, v]) => v != null && v !== "")).toString();
const lq = (t) => ({ conn: t.conn, site: t.site, list: t.list });

// ---------------------------------------------------------------- values (display + dates in the browser's time zone)
const pad = (n) => String(n).padStart(2, "0");
function localDate(iso) { const d = new Date(iso); return isNaN(d) ? String(iso) : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function localDateTime(iso) { const d = new Date(iso); return isNaN(d) ? String(iso) : `${localDate(iso)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function toIso(d) { return d.toISOString().replace(/\.\d{3}Z$/, "Z"); }
function fromDateInput(v) { if (!v) return null; const [y, m, d] = v.split("-").map(Number); return toIso(new Date(y, m - 1, d)); }       // local midnight → UTC instant
function fromDateTimeInput(v) { return v ? toIso(new Date(v)) : null; }
function toDateTimeInput(iso) { const d = new Date(iso); return `${localDate(iso)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function text(col, v) {  // plain text of a value, for filtering / sorting / the review
  if (v == null || v === "") return "";
  if (Array.isArray(v)) return v.map((x) => text(col, x)).join("; ");
  if (col) {
    if (col.kind === "date") return localDate(v);
    if (col.kind === "datetime") return localDateTime(v);
    if (col.kind === "boolean") return v ? "yes" : "no";
    if ((col.kind === "person" || col.kind === "lookup")) return "#" + v;
  }
  if (typeof v === "object") return v.Url ? (v.Description ? `${v.Description} (${v.Url})` : v.Url) : JSON.stringify(v);
  return String(v);
}

// ---------------------------------------------------------------- state
const S = { conns: [], lists: {}, open: new Set(JSON.parse(store.get("sp.open") || "[]")), tabs: [], active: -1, loading: {} };
const T = () => S.tabs[S.active];
function saveUi() { store.set("sp.open", JSON.stringify([...S.open])); store.set("sp.tabs", JSON.stringify(S.tabs.map((t) => ({ conn: t.conn, site: t.site, list: t.list, name: t.name })))); store.set("sp.active", String(S.active)); }

// ---------------------------------------------------------------- sidebar tree
async function loadConns() {
  try { S.conns = (await api("GET", "connections")).connections; } catch (e) { toast(e.message, true); S.conns = []; }
  renderTree();
}
async function loadLists(cid, refresh) {
  S.loading[cid] = true; renderTree();
  try { S.lists[cid] = (await api("GET", `connections/${cid}/lists` + (refresh ? "?refresh=1" : ""))).sites; }
  catch (e) { S.lists[cid] = [{ site: { url: "", error: e.message, needs_signin: e.needsSignin }, lists: [] }]; }
  S.loading[cid] = false; renderTree();
}
function renderTree() {
  const tree = $("tree"); tree.replaceChildren();
  if (!S.conns.length) tree.append(h("div", { class: "muted", style: "padding:14px" }, "No connections yet."));
  const cur = T();
  for (const c of S.conns) {
    const open = S.open.has(c.id);
    const needs = c.auth === "device_code" && !c.signed_in;
    tree.append(h("div", { class: "node", onclick: () => { open ? S.open.delete(c.id) : S.open.add(c.id); saveUi(); if (!open && !S.lists[c.id]) loadLists(c.id); renderTree(); } },
      h("span", { class: "car" + (open ? " open" : "") }, icon("caret")), h("span", { class: "dot " + (needs ? "warn" : "ok") }),
      h("span", { class: "nm", title: `${c.tenant_id}` }, c.name), c.read_only ? h("span", { class: "chip ro", title: "Read-only: nothing can be written" }, "RO") : null,
      c.staged ? h("span", { class: "badge", title: "Staged changes" }, c.staged) : null,
      h("span", { class: "acts" },
        needs || c.auth === "device_code" ? h("button", { class: "ib", title: needs ? "Sign in" : "Sign in again", onclick: (e) => { e.stopPropagation(); signIn(c); } }, icon("key")) : null,
        h("button", { class: "ib", title: "Reload its lists", onclick: (e) => { e.stopPropagation(); loadLists(c.id, true); } }, icon("refresh")),
        h("button", { class: "ib", title: "Edit sites / read-only", onclick: (e) => { e.stopPropagation(); connDialog(c); } }, icon("edit")))));
    if (!open) continue;
    if (S.loading[c.id]) { tree.append(h("div", { class: "muted lvl1", style: "padding:4px 10px" }, "Loading…")); continue; }
    if (needs && !S.lists[c.id]) { tree.append(h("div", { class: "err" }, "Not signed in")); continue; }
    for (const o of S.lists[c.id] || []) {
      if (o.site.error) { tree.append(h("div", { class: "err" }, o.site.url ? `${o.site.url.replace(/^https:\/\//, "")} — ${o.site.error}` : o.site.error)); continue; }
      tree.append(h("div", { class: "node lvl1", title: o.site.url }, h("span", { class: "muted" }, icon("site")), h("span", { class: "nm" }, o.site.name)));
      for (const l of o.lists) {
        const on = cur && cur.conn === c.id && cur.list === l.id && cur.site === o.site.id;
        tree.append(h("div", { class: "node lvl2" + (on ? " active" : ""), title: l.description || l.name, onclick: () => openList(c.id, o.site.id, l.id, l.name, c) },
          h("span", { class: "muted" }, icon("sheet")), h("span", { class: "nm" }, l.name), l.staged ? h("span", { class: "badge" }, l.staged) : null));
      }
    }
  }
}

// ---------------------------------------------------------------- connection dialog
function connDialog(existing) {
  const dlg = $("dlgConn");
  const st = { auth: existing ? existing.auth : "device_code", ro: existing ? existing.read_only : false };
  const f = {
    name: h("input", { type: "text", placeholder: "e.g. Contoso production", value: existing ? existing.name : "", disabled: !!existing }),

    h("table", { class: "t" }, h("tbody", null, r.fields.map((f) => h("tr", null, h("td", { style: "width:26%" }, f.display),
      h("td", null, r.op === "create" ? null : [h("span", { class: "ov old" }, text(colOf(f.field), f.old) || "(empty)"), h("span", { class: "arrow" }, "→")],
        h("span", { class: "ov new" }, text(colOf(f.field), f.new) || "(empty)"),
        f.stored !== undefined ? h("span", { class: "muted", style: "margin-left:8px" }, "stored: ", text(colOf(f.field), f.stored) || "(empty)") : null,
        f.live !== undefined && r.outcome === "conflict" ? h("div", null, "SharePoint now has: ", h("span", { class: "ov live" }, text(colOf(f.field), f.live) || "(empty)")) : null))))),
    r.message ? h("div", { class: "msg" + (r.outcome === "applied" ? " warn" : "") }, r.message) : null));
  const conflicts = out.conflict, left = out.conflict + out.failed + out.invalid;
  dlg.replaceChildren(h("div", { class: "dh" }, h("span", { class: "grow" }, "Result"), h("button", { class: "ib", title: "Close", onclick: () => dlg.close() }, icon("x"))),
    h("div", { class: "db" }, items),
    h("div", { class: "df" }, h("span", { class: "grow" }, `${out.applied} row(s) written (${out.fields_written} field(s))${out.unchanged ? `, ${out.unchanged} already up to date` : ""}${left ? `, ${left} not written` : ""}.`),
      conflicts ? h("button", { class: "ib", title: "Take SharePoint's current values as the 'old' side, then review again", onclick: async () => { await api("POST", "staged/rebase", lq(t)); openReview(); } }, icon("refresh"), "Refresh old values") : null,
      h("button", { class: "ib primary", onclick: () => dlg.close() }, "Done")));
  dlg.addEventListener("close", () => loadTab(t), { once: true });
}
$("btnReview").onclick = () => openReview();

// ---------------------------------------------------------------- schema + audit + csv + toolbar
$("btnSchema").onclick = () => {
  const t = T(); if (!t || !t.cols) return; const dlg = $("dlgSchema");
  dlg.replaceChildren(h("div", { class: "dh" }, h("span", { class: "grow" }, `Columns — ${t.name} (${t.cols.length})`), h("button", { class: "ib", title: "Close", onclick: () => dlg.close() }, icon("x"))),
    h("div", { class: "db" }, h("table", { class: "t" }, h("thead", null, h("tr", null, ["Name", "Internal name", "Type", "Flags", "Choices / notes"].map((x) => h("th", null, x)))),
      h("tbody", null, t.cols.map((c) => h("tr", null, h("td", null, c.display), h("td", { class: "muted" }, c.name === c.display ? "" : c.name), h("td", null, c.kind + (c.multi ? " (multi)" : "")),
        h("td", null, [c.required ? "required" : "", c.hidden ? "hidden" : "", c.system ? "system" : "", c.indexed ? "indexed" : "", c.editable ? "editable" : "read-only"].filter(Boolean).map((f) => h("span", { class: "chip" }, f))),
        h("td", { class: "muted" }, c.choices.length ? c.choices.join(", ") : (!c.editable ? c.why : c.max_length ? `max ${c.max_length} chars` : ""))))))));
  dlg.showModal();
};
$("btnAudit").onclick = async () => {
  const t = T(); if (!t) return; const dlg = $("dlgAudit");
  let r; try { r = await api("GET", "audit" + qs({ conn: t.conn, list: t.list })); } catch (e) { toast(e.message, true); return; }
  const colOf = (n) => (t.cols || []).find((c) => c.name === n);
  dlg.replaceChildren(h("div", { class: "dh" }, h("span", { class: "grow" }, `Written to ${t.name}`), h("button", { class: "ib", title: "Close", onclick: () => dlg.close() }, icon("x"))),
    h("div", { class: "db" }, r.entries.length ? h("table", { class: "t" }, h("thead", null, h("tr", null, ["When", "Item", "Column", "Old → new", "Result"].map((x) => h("th", null, x)))),
      h("tbody", null, r.entries.map((e) => h("tr", null, h("td", { class: "muted" }, new Date(e.ts).toLocaleString()), h("td", null, e.item_id ? "#" + e.item_id : "new"), h("td", null, e.field),
        h("td", null, [e.old == null ? "" : text(colOf(e.field), e.old), " → ", text(colOf(e.field), e.new)]), h("td", null, e.outcome + (e.source === "python" ? " (python)" : "") + (e.detail ? " — " + e.detail : ""))))))
      : h("div", { class: "muted" }, "Nothing has been written from this tool yet.")));
  dlg.showModal();
};
$("btnCsv").onclick = () => { const t = T(); if (t) { const a = h("a", { href: "export.csv" + qs(lq(t)), download: `${t.name}.csv` }); document.body.append(a); a.click(); a.remove(); } };
$("btnReload").onclick = () => { const t = T(); if (t) { t.loaded = false; loadTab(t); } };
$("btnSystem").onclick = () => { const t = T(); if (t) { t.showSystem = !t.showSystem; render(); } };
let ft; $("filter").oninput = (e) => { const t = T(); if (!t) return; t.filter = e.target.value; clearTimeout(ft); ft = setTimeout(renderGrid, 120); };
$("btnAddConn").onclick = () => connDialog(null);
const setCollapsed = (on) => { document.body.classList.toggle("collapsed", on); $("btnShow").hidden = !on; store.set("sp.collapsed", on ? "1" : "0"); };
$("btnHide").onclick = () => setCollapsed(true); $("btnShow").onclick = () => setCollapsed(false);
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") { e.preventDefault(); setCollapsed(!document.body.classList.contains("collapsed")); } });
(() => { const r = $("resizer"), side = $("side"); let drag = false;
  const w = +store.get("sp.sideW"); if (w >= 200 && w <= 520) side.style.width = w + "px";
  r.addEventListener("mousedown", (e) => { drag = true; e.preventDefault(); });
  window.addEventListener("mousemove", (e) => { if (drag) side.style.width = Math.max(200, Math.min(520, e.clientX)) + "px"; });
  window.addEventListener("mouseup", () => { if (drag) { drag = false; store.set("sp.sideW", parseInt(side.style.width)); } }); })();

// ---------------------------------------------------------------- start
for (const [id, name] of [["btnAddConn", "plus"], ["btnHide", "panel"], ["btnShow", "panel"], ["btnReload", "refresh"], ["btnSystem", "cols"], ["btnSchema", "schema"], ["btnAddRow", "plus"], ["btnCsv", "dl"], ["btnAudit", "clock"]]) $(id).append(icon(name));
$("emptyIcon").append(icon("sheet"));
(async () => {
  if (store.get("sp.collapsed") === "1") setCollapsed(true);
  await loadConns();
  for (const c of S.conns) if (S.open.has(c.id)) loadLists(c.id);
  let saved = []; try { saved = JSON.parse(store.get("sp.tabs") || "[]"); } catch (e) { /* ignore */ }
  for (const s of saved) { const c = S.conns.find((x) => x.id === s.conn); if (c) S.tabs.push({ ...s, connName: c.name, readOnly: c.read_only, cols: null, items: [], next: null, staged: { byItem: {}, creates: [], digest: "" }, filter: "", showSystem: false, sort: null, loaded: false, busy: false }); }
  S.active = Math.min(Math.max(+store.get("sp.active") || 0, 0), S.tabs.length - 1);
  renderTabs(); render(); const t = T(); if (t) loadTab(t);
})();
</script>
</body>
</html>
