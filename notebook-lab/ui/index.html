<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notebook</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f6fb; --surface: #ffffff; --border: #dde1ef; --text: #1c2035; --muted: #6b7180; --accent: #4f5ef0;
    --ok: #15803d; --ok-bg: rgba(22,163,74,0.12); --warn: #b45309; --warn-bg: rgba(217,119,6,0.12);
    --err: #b91c1c; --err-bg: rgba(220,38,38,0.08); --run-bg: rgba(79,94,240,0.10); --hover: rgba(28,32,53,0.07);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --code-bg: #fbfcfe;
    --kw: #7c3aed; --str: #15803d; --num: #b45309; --cmt: #8b93a7; --fn: #2563eb; --bi: #0e7490;
  }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; font-size: 14px; }
  [hidden] { display: none !important; }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input[type=text], select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: .82rem; font-family: inherit; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--run-bg); border-color: var(--accent); }
  .ic { display: inline-flex; vertical-align: middle; } .ic svg { display: block; }
  .ib { border: 0; background: transparent; border-radius: 6px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
  .ib:hover:not(:disabled) { background: var(--hover); color: var(--text); } .ib.on { background: var(--run-bg); color: var(--accent); }
  .ib.danger:hover:not(:disabled) { color: var(--err); background: var(--err-bg); } .ib.primary { color: var(--accent); }
  .ib.sm { width: 22px; height: 22px; border-radius: 5px; }
  .sep { width: 1px; height: 18px; background: var(--border); margin: 0 5px; flex: none; }
  .spacer { flex: 1; } .muted { color: var(--muted); } .mono { font-family: var(--mono); }
  .spin svg { animation: spin 0.9s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }

  /* rail + side panel */
  #rail { width: 44px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 4px; }
  #rail .ib { width: 34px; height: 34px; border-radius: 8px; position: relative; } #rail .ib.on { box-shadow: inset 2px 0 0 var(--accent); border-radius: 2px 8px 8px 2px; }
  #side { width: var(--sw, 300px); flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
  #resizer { width: 4px; margin-left: -2px; cursor: col-resize; flex: none; z-index: 5; } #resizer:hover, #resizer.drag { background: var(--accent); opacity: .5; }
  body.noside #side, body.noside #resizer { display: none; } body.norail #rail, body.norail #side, body.norail #resizer { display: none; }
  .shead { display: flex; align-items: center; gap: 2px; padding: 8px 8px 6px; border-bottom: 1px solid var(--border); }
  .shead select { flex: 1; }
  .panel { flex: 1; min-height: 0; display: none; flex-direction: column; } .panel.on { display: flex; }
  .ptools { display: flex; align-items: center; flex-wrap: wrap; gap: 1px; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  #crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 6px 10px 2px; font-size: .78rem; color: var(--muted); }
  #crumbs a { cursor: pointer; padding: 1px 4px; border-radius: 4px; } #crumbs a:hover { background: var(--hover); color: var(--text); }
  #flist { flex: 1; overflow: auto; padding: 2px 6px 10px; }
  .frow { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; font-size: .83rem; cursor: pointer; }
  .frow:hover { background: var(--hover); } .frow.cur { background: var(--run-bg); } .frow .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .sz { color: var(--muted); font-size: .7rem; } .frow .acts { display: none; } .frow:hover .acts { display: flex; } .frow:hover .sz { display: none; }
  .frow .ic { color: var(--muted); } .frow.dir .ic { color: #d29922; } .frow.nb .ic { color: #e8710a; }
  .sfoot { padding: 5px 10px; border-top: 1px solid var(--border); font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #uploads { padding: 0 10px; } .upl { font-size: .72rem; margin: 3px 0; } .upl .bar { height: 3px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 2px; } .upl .bar i { display: block; height: 100%; background: var(--accent); }
  #dropveil { position: absolute; inset: 0; background: var(--run-bg); border: 2px dashed var(--accent); border-radius: 8px; display: none; align-items: center; justify-content: center; color: var(--accent); z-index: 9; pointer-events: none; }
  #side.over #dropveil { display: flex; }
  .pk { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .pk .row { display: flex; gap: 4px; align-items: center; } .pk input { flex: 1; }
  #pkglog { font-family: var(--mono); font-size: .68rem; background: #0f1222; color: #d6dcff; border-radius: 6px; padding: 6px; max-height: 200px; overflow: auto; white-space: pre-wrap; }
  #pkgs { display: flex; flex-wrap: wrap; gap: 4px; overflow: auto; } .chip { font-size: .7rem; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; background: var(--bg); }
  .chip i { font-style: normal; color: var(--muted); margin-left: 4px; }

  /* main: tabs + toolbar + documents */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #tabs { display: flex; align-items: flex-end; height: 36px; background: var(--bg); border-bottom: 1px solid var(--border); padding-left: 4px; gap: 1px; flex: none; }
  #tabs .ib { align-self: center; margin-right: 4px; }
  #tabs .tabs { display: flex; align-items: flex-end; gap: 1px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; height: 31px; background: #e9ecf6; border: 1px solid var(--border); border-bottom: 0; border-radius: 7px 7px 0 0; font-size: .8rem; cursor: pointer; white-space: nowrap; max-width: 200px; color: var(--muted); }
  .tab.on { background: var(--surface); color: var(--text); height: 32px; margin-bottom: -1px; box-shadow: inset 0 2px 0 var(--accent); }
  .tab .t { overflow: hidden; text-overflow: ellipsis; } .tab .ic { flex: none; } .tab .x { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
  .tab .x:hover { background: var(--hover); } .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #toolbar { display: none; align-items: center; gap: 1px; height: 38px; padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--border); flex: none; overflow-x: auto; scrollbar-width: none; }
  #toolbar.on { display: flex; } #toolbar .grp { display: none; align-items: center; gap: 1px; } #toolbar .grp.on { display: flex; }
  .kpill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 2px 10px 2px 8px; font-size: .74rem; font-weight: 600; color: var(--muted); height: 24px; white-space: nowrap; }
  .kpill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); } .kpill.idle i { background: #16a34a; } .kpill.busy i, .kpill.starting i { background: var(--accent); animation: pulse 1s infinite; } .kpill.dead i { background: var(--err); }
  @keyframes pulse { 50% { opacity: .3; } }
  #docs { flex: 1; overflow: auto; position: relative; background: var(--bg); }
  .docview { display: none; padding: 10px 16px 55vh 8px; } .docview.on { display: block; }
  #empty { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #c3c9dc; } #empty.on { display: flex; }
  #empty .ib { width: 44px; height: 44px; border: 1px dashed var(--border); border-radius: 12px; color: var(--accent); }

  /* cells */
  .cell { display: flex; gap: 4px; position: relative; border-radius: 6px; outline: none; }
  .cell::before { content: ""; width: 3px; flex: none; border-radius: 3px; margin: 2px 0; background: transparent; }
  .cell.active::before { background: var(--accent); opacity: .45; } .cell.editing::before { background: var(--ok); opacity: .9; }
  .prompt { width: 52px; flex: none; text-align: right; padding: 5px 4px 0 0; font: .7rem var(--mono); color: var(--accent); user-select: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .prompt .ib { opacity: 0; } .cell:hover .prompt .ib, .cell.active .prompt .ib { opacity: 1; } .cell.running .prompt .ib { opacity: 1; color: var(--accent); }
  .cbody { flex: 1; min-width: 0; }
  .codewrap { position: relative; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; } .cell.editing .codewrap { border-color: var(--ok); }
  .codewrap pre, .codewrap textarea { font: .82rem/1.55 var(--mono); padding: 7px 10px; white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; tab-size: 4; margin: 0; border: 0; }
  .codewrap pre { position: absolute; inset: 0; pointer-events: none; color: var(--text); overflow: hidden; }
  .codewrap textarea { position: relative; display: block; width: 100%; min-height: 36px; background: transparent; color: transparent; caret-color: var(--text); resize: none; outline: none; overflow: hidden; }
  .codewrap textarea::selection { background: rgba(79,94,240,.25); }
  textarea.plain { width: 100%; display: block; font: .85rem/1.55 var(--mono); padding: 7px 10px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; resize: none; outline: none; overflow: hidden; color: var(--text); }
  .t-kw { color: var(--kw); font-weight: 600; } .t-str { color: var(--str); } .t-num { color: var(--num); } .t-cmt { color: var(--cmt); font-style: italic; } .t-fn { color: var(--fn); } .t-bi { color: var(--bi); } .t-dec { color: var(--fn); }
  .ctools { position: absolute; right: 6px; top: -13px; display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 1px; z-index: 3; box-shadow: 0 2px 6px rgba(28,32,53,.08); }
  .cell:hover .ctools, .cell.active .ctools { display: flex; }
  .mdview { padding: 4px 12px; font-size: .92rem; line-height: 1.6; cursor: text; min-height: 28px; }
  .mdview h1, .mdview h2, .mdview h3 { margin: .35em 0 .25em; } .mdview h1 { font-size: 1.6rem; } .mdview h2 { font-size: 1.25rem; } .mdview h3 { font-size: 1.05rem; }
  .mdview code { background: var(--hover); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: .84em; } .mdview pre { background: var(--code-bg); border: 1px solid var(--border); padding: 8px; border-radius: 6px; overflow: auto; }
  .mdview ul, .mdview ol { margin-left: 22px; } .mdview blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--muted); } .mdview a { color: var(--accent); }
  .out { padding: 4px 4px 2px; font-size: .8rem; max-height: 600px; overflow: auto; } .out:empty { display: none; }
  .out pre { font: .78rem/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; margin: 1px 0; }
  .out pre.stderr { background: var(--warn-bg); } .out pre.err { background: var(--err-bg); color: var(--err); padding: 4px 8px; border-radius: 5px; }
  .out img { max-width: 100%; display: block; margin: 4px 0; } .out iframe { width: 100%; border: 0; display: block; min-height: 30px; }
  .gap { height: 12px; position: relative; margin-left: 56px; } .gap .gb { display: none; position: absolute; left: 50%; top: -4px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 0 3px; z-index: 2; }
  .gap:hover .gb { display: flex; } .gap.last { height: 40px; } .gap.last .gb { display: flex; opacity: .55; top: 6px; } .gap.last:hover .gb { opacity: 1; }
  .texted { width: 100%; height: calc(100vh - 100px); font: .83rem/1.5 var(--mono); resize: none; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1c2035; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: .82rem; z-index: 30; max-width: 80vw; }
  @media (max-width: 760px) { body:not(.noside) #side { position: absolute; z-index: 20; left: 44px; top: 0; bottom: 0; box-shadow: 4px 0 14px rgba(0,0,0,.12); } }
</style>
</head>
<body>

  <button class="ib" id="rPkgs" data-ic="package" title="Packages"></button>
</nav>
<aside id="side">

  <div class="shead">

  </div>

      <button class="ib" id="bNewDir" data-ic="folder-plus" title="New folder"></button>
      <span class="sep"></span>
      <button class="ib" id="bUp" data-ic="upload" title="Upload files"></button>
      <button class="ib" id="bUpDir" data-ic="folder-up" title="Upload a folder"></button>

      <button class="ib" id="bRefresh" data-ic="refresh" title="Refresh"></button>

<div id="resizer"></div>

<main id="main">
  <div id="tabs">
    <button class="ib" id="bSide" data-ic="panel" title="Show / hide sidebar (Ctrl+B)"></button>
    <div class="tabs" id="tabList"></div>
  </div>
  <div id="toolbar">
    <div class="grp" id="tbNb">
      <button class="ib" id="tSave" data-ic="save" title="Save (Ctrl+S)"></button>
      <button class="ib" id="tAdd" data-ic="plus" title="Add cell below"></button>
      <span class="sep"></span>
      <button class="ib" id="tRun" data-ic="play" title="Run cell (Shift+Enter)"></button>
      <button class="ib" id="tInt" data-ic="stop" title="Interrupt the kernel"></button>
      <button class="ib" id="tRestart" data-ic="restart" title="Restart the kernel"></button>
      <button class="ib" id="tRunAll" data-ic="forward" title="Run all cells"></button>
      <button class="ib" id="tRestartAll" data-ic="restart-play" title="Restart the kernel and run all cells"></button>
      <span class="sep"></span>
      <button class="ib" id="tCode" data-ic="code" title="Code cell"></button>
      <button class="ib" id="tMd" data-ic="type" title="Text (Markdown) cell"></button>
      <button class="ib" id="tClear" data-ic="eraser" title="Clear all outputs"></button>
      <span class="sep"></span>
      <button class="ib" id="tDl" data-ic="download" title="Download notebook (.ipynb)"></button>
    </div>
    <div class="grp" id="tbTxt">
      <button class="ib" id="tSaveTxt" data-ic="save" title="Save (Ctrl+S)"></button>
      <button class="ib" id="tDlTxt" data-ic="download" title="Download"></button>
    </div>
    <span class="spacer"></span>
    <div class="grp" id="tbKernel">
      <button class="kpill" id="kbadge" title=""><i></i><span>Stopped</span></button>
      <button class="ib" id="tKill" data-ic="power" title="Shut down the kernel"></button>
    </div>
  </div>
  <div id="docs"><div id="empty"></div></div>
</main>
<input type="file" id="fileIn" multiple hidden />
<input type="file" id="dirIn" webkitdirectory multiple hidden />

<script>
const $ = s => document.querySelector(s);
const h = (tag, a = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const J = (method, body) => ({ method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

    throw new Error(typeof d === 'string' ? d : d ? JSON.stringify(d) : r.status + ' ' + r.statusText);
  }
  return r.json();
}
function toast(msg) { const t = h('div', { class: 'toast' }, msg); document.body.append(t); setTimeout(() => t.remove(), 4500); }
const fail = e => toast(e.message || String(e));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

const fmt = n => n == null ? '' : n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';

const hashKey = s => { let x = 5381; for (const ch of s) x = ((x * 33) ^ ch.charCodeAt(0)) >>> 0; return x.toString(36); };

const uq = { items: [], running: 0 };

    x.onload = () => { let b = {}; try { b = JSON.parse(x.responseText); } catch (e) { /* ignore */ }

function enqueue(files) {

}

    it.state = 'run'; uq.running++; it.file._pct = 0;

      it.msg = r.extracted ? `${r.extracted.files} files` + (r.extracted.skipped ? ` (${r.extracted.skipped} skipped)` : '') : fmt(r.size);
    }).catch(e => { it.state = 'fail'; it.msg = e.message; }).finally(() => {

      pump();

}

}

// ---- python highlighting (overlay under a transparent textarea) ---------------------------------------------------
const PY_KW = new Set('and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PY_CONST = new Set(['True', 'False', 'None', 'self', 'cls']);
const PY_BI = new Set('print len range int float str list dict set tuple open type isinstance super enumerate zip map filter sum min max abs sorted reversed any all input bool bytes id hash iter next round repr vars dir getattr setattr hasattr format object Exception ValueError KeyError TypeError'.split(' '));
const escH = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const PY_RE = /(#[^\n]*)|('''[\s\S]*?(?:'''|$)|"""[\s\S]*?(?:"""|$)|"(?:\\.|[^"\\\n])*(?:"|(?=\n)|$)|'(?:\\.|[^'\\\n])*(?:'|(?=\n)|$))|(\d[\d_]*(?:\.\d*)?(?:[eE][+-]?\d+)?)|(@[A-Za-z_][\w.]*)|([A-Za-z_]\w*)/g;
function hl(src) {
  let out = '', last = 0, prev = '', m;
  PY_RE.lastIndex = 0;
  while ((m = PY_RE.exec(src))) {
    out += escH(src.slice(last, m.index)); last = PY_RE.lastIndex;
    const t = escH(m[0]);
    if (m[1]) out += `<span class="t-cmt">${t}</span>`;
    else if (m[2]) out += `<span class="t-str">${t}</span>`;
    else if (m[3]) out += `<span class="t-num">${t}</span>`;
    else if (m[4]) out += `<span class="t-dec">${t}</span>`;
    else {
      const w = m[5];
      if (PY_KW.has(w)) out += `<span class="t-kw">${t}</span>`;
      else if (prev === 'def' || prev === 'class') out += `<span class="t-fn">${t}</span>`;
      else if (PY_CONST.has(w)) out += `<span class="t-kw">${t}</span>`;
      else if (PY_BI.has(w)) out += `<span class="t-bi">${t}</span>`;
      else out += t;
      prev = w; continue;
    }
    prev = '';
  }
  return out + escH(src.slice(last)) + '\n';
}

// ---- markdown (small, escapes everything) --------------------------------------------------------------------------
function md(src) {
  const inl = s => escH(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*]+)\*/g, '$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null, code = null, para = [];
  const flushP = () => { if (para.length) out.push('<p>' + inl(para.join(' ')) + '</p>'); para = []; };
  const flushL = () => { if (list) out.push(`</${list}>`); list = null; };
  for (const line of src.split('\n')) {
    if (code !== null) { if (/^```/.test(line)) { out.push('<pre>' + escH(code.join('\n')) + '</pre>'); code = null; } else code.push(line); continue; }
    if (/^```/.test(line)) { flushP(); flushL(); code = []; continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flushP(); flushL(); out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); }
    else if ((m = line.match(/^\s*([-*]|\d+\.)\s+(.*)/))) { flushP(); const t = /\d/.test(m[1]) ? 'ol' : 'ul'; if (list !== t) { flushL(); out.push(`<${t}>`); list = t; } out.push('<li>' + inl(m[2]) + '</li>'); }
    else if ((m = line.match(/^>\s?(.*)/))) { flushP(); flushL(); out.push('<blockquote>' + inl(m[1]) + '</blockquote>'); }
    else if (/^---+\s*$/.test(line)) { flushP(); flushL(); out.push('<hr>'); }
    else if (!line.trim()) { flushP(); flushL(); }
    else { flushL(); para.push(line.trim()); }
  }
  if (code !== null) out.push('<pre>' + escH(code.join('\n')) + '</pre>');
  flushP(); flushL();
  return out.join('\n');
}

// ---- outputs -----------------------------------------------------------------------------------------------------
const ansi = s => s.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, '');
function termText(t) {
  return t.split('\n').map(line => {
    if (!line.includes('\r')) return line;
    let cur = ''; for (const s of line.split('\r')) cur = s + cur.slice(s.length); return cur;
  }).join('\n');
}
const mime = (d, k) => { const v = d[k]; return Array.isArray(v) ? v.join('') : v; };
function outEl(o) {

  if (o.output_type === 'error') return h('pre', { class: 'err' }, ansi((o.traceback && o.traceback.length ? o.traceback.join('\n') : o.ename + ': ' + o.evalue)));
  const d = o.data || {};
  for (const t of ['image/png', 'image/jpeg']) if (d[t]) return h('img', { src: `data:${t};base64,${mime(d, t).replace(/\s/g, '')}` });
  if (d['image/svg+xml']) return h('img', { src: 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(mime(d, 'image/svg+xml')))) });
  if (d['text/html']) {
    // sandbox WITHOUT allow-scripts: tables render, nothing runs; allow-same-origin only so we can size the frame
    const f = h('iframe', { sandbox: 'allow-same-origin' });
    f.srcdoc = '<style>body{font:13px system-ui,sans-serif;margin:4px;color:#1c2035}table{border-collapse:collapse}td,th{border:1px solid #dde1ef;padding:3px 8px;text-align:right}th{background:#f4f6fb}</style>' + mime(d, 'text/html');
    f.style.height = '30px';
    f.onload = () => { try { f.style.height = (Math.ceil(f.contentDocument.documentElement.getBoundingClientRect().height) + 8) + 'px'; } catch (e) { /* ignore */ } };
    return f;
  }

  if (d['text/plain']) return h('pre', {}, ansi(mime(d, 'text/plain')));
  return h('pre', { class: 'muted' }, '[' + Object.keys(d).join(', ') + ']');
}
const sig = o => (o.output_type || '') + (o.name || '') + ':' + (o.text ? o.text.length : JSON.stringify(o.data || o.traceback || '').length);
function renderOut(c) {
  const box = c.outBox, outs = c.outputs || [];

    const s = sig(o);

async function openDoc(path) {

    doc.cells = nb.cells.map(c => ({ ...c, doc, status: 'idle' }));

  } else {

  }
  doc.key = hashKey(S.ws + '/' + path); doc.name = path.split('/').pop();
  doc.view = h('div', { class: 'docview' + (doc.type === 'text' ? ' text' : '') });
  $('#docs').append(doc.view);
  S.docs.push(doc);
  if (doc.type === 'nb') renderCells(doc); else mountText(doc);
  activate(doc);
  if (doc.type === 'nb') await reattach(doc);
}
function mountText(doc) {
  doc.ta = h('textarea', { class: 'texted', spellcheck: 'false' }); doc.ta.value = doc.initial;
  doc.ta.addEventListener('input', () => { doc.dirty = true; renderTabs(); });
  doc.view.append(doc.ta);
}
let restoring = false;
function rememberTabs() { if (S.ws && !restoring) lsSet('nb.open.' + S.ws, JSON.stringify({ paths: S.docs.map(d => d.path), cur: S.cur ? S.cur.path : null })); }
function activate(doc) {
  S.cur = doc; rememberTabs();
  for (const d of S.docs) d.view.classList.toggle('on', d === doc);
  $('#empty').classList.toggle('on', !doc); renderEmpty();
  $('#toolbar').classList.toggle('on', !!doc);
  $('#tbNb').classList.toggle('on', !!doc && doc.type === 'nb'); $('#tbTxt').classList.toggle('on', !!doc && doc.type === 'text');
  $('#tbKernel').classList.toggle('on', !!doc && doc.type === 'nb');
  renderTabs(); syncToolbar();
  document.querySelectorAll('.frow').forEach(r => r.classList.toggle('cur', !!doc && r.querySelector('.n').title === doc.name && (S.path ? S.path + '/' : '') + doc.name === doc.path));
  if (doc && doc.type === 'nb') refreshKernel();
}
function renderEmpty() {
  const e = $('#empty'); e.innerHTML = '';
  e.append(ic('notebook', 72), S.ws ? ib('notebook-plus', 'New notebook', () => newItem('nb'), '', 22) : ib('plus', 'New workspace', () => $('#wsNew').click(), '', 22));
}
function renderTabs() {
  const box = $('#tabList'); box.innerHTML = '';
  for (const d of S.docs) {
    const busy = d.type === 'nb' && d.cells.some(c => c.status === 'running' || c.status === 'queued');
    box.append(h('div', { class: 'tab' + (d === S.cur ? ' on' : ''), title: d.path, onclick: () => activate(d), onauxclick: e => e.button === 1 && closeDoc(d) },
      busy ? h('span', { class: 'spin' }, ic('loader', 14)) : ic(d.type === 'nb' ? 'notebook' : 'file', 14),
      h('span', { class: 't' }, d.name),
      h('span', { class: 'x', title: 'Close', onclick: e => { e.stopPropagation(); closeDoc(d); } }, d.dirty ? h('span', { class: 'dot' }) : ic('x', 12))));
  }
}
async function closeDoc(doc, force) {
  if (doc.type === 'nb' && doc.dirty) await saveDoc(doc).catch(() => {});
  if (doc.type === 'text' && doc.dirty && !force && !confirm(`Discard unsaved changes to ${doc.path}?`)) return;
  for (const [k, p] of [...S.polls]) if (p.doc === doc) S.polls.delete(k);
  clearTimeout(doc.saveT);
  const wasCur = S.cur === doc, i = S.docs.indexOf(doc); doc.view.remove(); S.docs.splice(i, 1);
  if (wasCur) activate(S.docs[i] || S.docs[i - 1] || null); else { renderTabs(); rememberTabs(); }
}

// ---- notebook cells ----------------------------------------------------------------------------------------------
const byId = (doc, id) => doc.cells.find(c => String(c.id).slice(0, 48) === id);
function renderCells(doc) {
  const keep = $('#docs').scrollTop;
  doc.view.innerHTML = '';
  doc.view.append(gapEl(doc, 0, false));
  doc.cells.forEach((c, i) => { doc.view.append(cellEl(doc, c)); doc.view.append(gapEl(doc, i + 1, i === doc.cells.length - 1)); });
  $('#docs').scrollTop = keep;
}
function gapEl(doc, idx, last) {
  return h('div', { class: 'gap' + (last ? ' last' : '') }, h('div', { class: 'gb' },
    ib('code', 'Add code cell', () => insertCell(doc, idx, 'code'), 'sm', 14), ib('type', 'Add text cell', () => insertCell(doc, idx, 'markdown'), 'sm', 14)));
}
function insertCell(doc, idx, type, cmd = false) {
  const c = { id: newId(), cell_type: type, source: '', outputs: [], execution_count: null, status: 'idle', doc };
  doc.cells.splice(idx, 0, c); renderCells(doc); markDirty(doc);
  if (cmd) c.root.focus(); else { if (type === 'markdown') editMd(c); else c.ta.focus(); }
  return c;
}
function autosize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function indentSel(c, dedent) {
  const ta = c.ta, v = ta.value; let s = ta.selectionStart, e = ta.selectionEnd;
  const a = v.lastIndexOf('\n', s - 1) + 1; let b = v.indexOf('\n', e); if (b < 0) b = v.length;
  const lines = v.slice(a, b).split('\n').map(l => dedent ? l.replace(/^( {1,4}|\t)/, '') : '    ' + l);
  const txt = lines.join('\n'); ta.setRangeText(txt, a, b, 'preserve');
  ta.selectionStart = Math.max(a, s + (dedent ? -Math.min(4, (v.slice(a).match(/^ {0,4}/)[0] || '').length) : 4)); ta.selectionEnd = a + txt.length - (b - e);
  ta.dispatchEvent(new Event('input'));
}
function cellEl(doc, c) {
  const isMd = c.cell_type === 'markdown';
  c.sigs = [];
  c.ta = h('textarea', { spellcheck: 'false', rows: 1, class: isMd ? 'plain' : '' });
  c.ta.value = c.source;
  c.hl = h('pre', { 'aria-hidden': 'true' });
  c.outBox = h('div', { class: 'out' });
  c.view = h('div', { class: 'mdview', title: 'Double-click to edit', ondblclick: () => editMd(c) });
  c.runBtn = ib('play', 'Run cell (Shift+Enter)', () => (c.status === 'running' || c.status === 'queued') ? interrupt() : runCell(c), '', 15);
  c.cnt = h('span', {});
  const refresh = () => { c.source = c.ta.value; autosize(c.ta); if (!isMd) c.hl.innerHTML = hl(c.source); markDirty(doc); };
  c.ta.addEventListener('input', refresh);
  c.ta.addEventListener('focus', () => { setActive(doc, c); c.root.classList.add('editing'); });
  c.ta.addEventListener('blur', () => { c.root.classList.remove('editing'); if (isMd && c.source.trim()) showMd(c); });
  c.ta.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); c.root.focus(); return; }
    if (e.key === 'Enter' && (e.shiftKey || e.ctrlKey || e.metaKey || e.altKey)) {
      e.preventDefault(); runCell(c);
      const i = doc.cells.indexOf(c);
      if (e.altKey) insertCell(doc, i + 1, 'code');
      else if (e.shiftKey) { if (i === doc.cells.length - 1) insertCell(doc, i + 1, 'code'); else focusCell(doc.cells[i + 1], false); }
      return;
    }
    if (isMd) return;
    if (e.key === 'Enter' && !e.shiftKey) {
      const v = c.ta.value, s = c.ta.selectionStart, line = v.slice(v.lastIndexOf('\n', s - 1) + 1, s);
      let ind = line.match(/^[ \t]*/)[0]; if (/:\s*$/.test(line)) ind += '    ';
      e.preventDefault(); c.ta.setRangeText('\n' + ind, s, c.ta.selectionEnd, 'end'); c.ta.dispatchEvent(new Event('input'));
    } else if (e.key === 'Tab') {
      e.preventDefault();
      if (c.ta.value.slice(c.ta.selectionStart, c.ta.selectionEnd).includes('\n') || e.shiftKey) indentSel(c, e.shiftKey);
      else { const s = c.ta.selectionStart; c.ta.setRangeText('    ', s, c.ta.selectionEnd, 'end'); c.ta.dispatchEvent(new Event('input')); }
    }
  });
  c.root = h('div', { class: 'cell', tabindex: '-1' });
  c.root.addEventListener('focusin', () => setActive(doc, c));
  c.root.addEventListener('keydown', e => cmdKey(doc, c, e));
  c.root.addEventListener('mousedown', () => setActive(doc, c));
  const tools = h('div', { class: 'ctools' },
    ib('up', 'Move up', () => move(doc, c, -1), 'sm', 14), ib('down', 'Move down', () => move(doc, c, 1), 'sm', 14),
    ib('copy', 'Duplicate', () => duplicate(doc, c), 'sm', 14),
    ib(isMd ? 'code' : 'type', isMd ? 'Make it a code cell' : 'Make it a text cell', () => setType(doc, c, isMd ? 'code' : 'markdown'), 'sm', 14),
    isMd ? null : ib('eraser', 'Clear output', () => { c.outputs = []; renderOut(c); markDirty(doc); }, 'sm', 14),
    ib('trash', 'Delete cell', () => delCell(doc, c), 'sm danger', 14));
  const editor = isMd ? c.ta : h('div', { class: 'codewrap' }, c.hl, c.ta);
  c.root.append(h('div', { class: 'prompt' }, isMd ? null : [c.runBtn, c.cnt]), h('div', { class: 'cbody' }, editor, c.view, isMd ? null : c.outBox), tools);
  if (isMd) { if (c.source.trim()) showMd(c); else c.view.hidden = true; } else { c.view.hidden = true; c.hl.innerHTML = hl(c.source); renderOut(c); }
  setGutter(c);
  requestAnimationFrame(() => autosize(c.ta));
  return c.root;
}
function setActive(doc, c) {
  if (doc.active === c) return;
  if (doc.active && doc.active.root) doc.active.root.classList.remove('active');
  doc.active = c; c.root.classList.add('active'); syncToolbar();
}
const activeCell = doc => (doc.active && doc.cells.includes(doc.active)) ? doc.active : doc.cells[0];
function focusCell(c, edit) { if (!c) return; if (edit) { if (c.cell_type === 'markdown') editMd(c); else c.ta.focus(); } else c.root.focus(); }
let lastD = 0;
function cmdKey(doc, c, e) {
  if (e.target !== c.root || e.ctrlKey || e.metaKey) return;
  const i = doc.cells.indexOf(c), k = e.key;
  if (k === 'Enter' && e.shiftKey) { e.preventDefault(); runCell(c); focusCell(doc.cells[i + 1] || insertCell(doc, i + 1, 'code', true), false); }
  else if (k === 'Enter') { e.preventDefault(); focusCell(c, true); }
  else if (k === 'ArrowUp' || k === 'k') { e.preventDefault(); focusCell(doc.cells[i - 1], false); }
  else if (k === 'ArrowDown' || k === 'j') { e.preventDefault(); focusCell(doc.cells[i + 1], false); }
  else if (k === 'a') { e.preventDefault(); insertCell(doc, i, 'code', true); }
  else if (k === 'b') { e.preventDefault(); insertCell(doc, i + 1, 'code', true); }
  else if (k === 'm') { e.preventDefault(); setType(doc, c, 'markdown'); }
  else if (k === 'y') { e.preventDefault(); setType(doc, c, 'code'); }
  else if (k === 'd') { e.preventDefault(); if (Date.now() - lastD < 600) { lastD = 0; delCell(doc, c, true); } else lastD = Date.now(); }
}
function showMd(c) { c.view.innerHTML = md(c.source); c.view.hidden = false; c.ta.hidden = true; }
function editMd(c) { c.view.hidden = true; c.ta.hidden = false; autosize(c.ta); c.ta.focus(); }
function setGutter(c) {
  if (!c.runBtn) return;
  const busy = c.status === 'running' || c.status === 'queued';
  c.runBtn.firstChild.replaceWith(ic(busy ? 'stop' : 'play', 15));
  c.runBtn.title = busy ? 'Interrupt' : 'Run cell (Shift+Enter)';
  c.cnt.textContent = c.status === 'queued' ? '[…]' : c.status === 'running' ? '[*]' : c.execution_count != null ? `[${c.execution_count}]` : '';
  c.root.classList.toggle('running', busy);
}
function move(doc, c, d) { const i = doc.cells.indexOf(c), j = i + d; if (j < 0 || j >= doc.cells.length) return; doc.cells.splice(i, 1); doc.cells.splice(j, 0, c); renderCells(doc); markDirty(doc); focusCell(c, false); }
function duplicate(doc, c) { const n = { ...c, id: newId(), outputs: [], execution_count: null, status: 'idle' }; doc.cells.splice(doc.cells.indexOf(c) + 1, 0, n); renderCells(doc); markDirty(doc); focusCell(n, false); }
function setType(doc, c, t) { if (c.cell_type === t) return; c.cell_type = t; if (t === 'markdown') c.outputs = []; renderCells(doc); markDirty(doc); focusCell(c, false); }
function delCell(doc, c, quick) {
  if (!quick && c.source.trim() && !confirm('Delete this cell?')) return;
  const i = doc.cells.indexOf(c); S.polls.delete(ckey(doc, c)); doc.cells.splice(i, 1);
  if (!doc.cells.length) doc.cells.push({ id: newId(), cell_type: 'code', source: '', outputs: [], execution_count: null, status: 'idle', doc });
  renderCells(doc); markDirty(doc); focusCell(doc.cells[Math.min(i, doc.cells.length - 1)], false);
}

// ---- running -----------------------------------------------------------------------------------------------------
async function runCell(c, batch = null) {
  const doc = c.doc;
  if (c.cell_type === 'markdown') { showMd(c); return; }
  if (!c.source.trim()) return;
  c.status = 'queued'; c.outputs = []; renderOut(c); setGutter(c); renderTabs();
  try {
    const r = await api(wsUrl('kernel/execute'), J('POST', { code: c.source, cell_id: ckey(doc, c), batch }));
    S.polls.set(ckey(doc, c), { doc, cell: c, eid: r.id, v: -1 }); pollSoon(); refreshKernel();
  } catch (e) { c.status = 'idle'; setGutter(c); renderTabs(); c.outputs = [{ output_type: 'error', ename: 'Error', evalue: e.message, traceback: [] }]; renderOut(c); }
}
async function runAll(doc) { const batch = newId(); for (const c of doc.cells) if (c.cell_type === 'code' && c.source.trim()) await runCell(c, batch); }
let pollTimer = null;
function pollSoon() { if (!pollTimer) pollTimer = setInterval(pollAll, 600); }
async function pollAll() {
  if (S.polling) return; S.polling = true;
  try {
    for (const [k, p] of [...S.polls]) {
      const c = p.cell;
      try {
        const v = await api(wsUrl(`executions/${p.eid}?v=${p.v}`));
        p.v = v.version;
        if (v.outputs) { c.outputs = v.outputs; renderOut(c); }
        if (v.count != null) c.execution_count = v.count;
        c.status = ['ok', 'error', 'aborted'].includes(v.status) ? 'idle' : v.status;
        setGutter(c);
        if (c.status === 'idle') { S.polls.delete(k); markDirty(p.doc); renderTabs(); }
      } catch (e) { S.polls.delete(k); c.status = 'idle'; setGutter(c); renderTabs(); }
    }
  } finally {
    S.polling = false;
    if (!S.polls.size) { clearInterval(pollTimer); pollTimer = null; if (S.ws) { loadFiles().catch(() => {}); refreshKernel(); } }
  }
}
async function reattach(doc) {
  const k = await api(wsUrl('kernel')); applyKernel(k);
  for (const e of k.executions) {
    if (!e.cell_id.startsWith(doc.key + ':')) continue;
    const c = byId(doc, e.cell_id.slice(doc.key.length + 1)); if (!c) continue;
    if (e.status === 'queued' || e.status === 'running') { c.status = e.status; setGutter(c); S.polls.set(ckey(doc, c), { doc, cell: c, eid: e.id, v: -1 }); }
    else if (e.ended && e.ended > doc.mtime) {       // finished while the page was closed: adopt its outputs
      try { const v = await api(wsUrl('executions/' + e.id)); c.outputs = v.outputs || []; c.execution_count = v.count; renderOut(c); setGutter(c); markDirty(doc); } catch (err) { /* expired */ }
    }
  }
  if (S.polls.size) { pollSoon(); renderTabs(); }
}

// ---- kernel ------------------------------------------------------------------------------------------------------
const KLABEL = { stopped: 'Stopped', starting: 'Starting', idle: 'Idle', busy: 'Busy', dead: 'Dead' };
function applyKernel(k) {
  S.kernel = k;
  const b = $('#kbadge'); b.className = 'kpill ' + k.state;
  b.lastChild.textContent = (KLABEL[k.state] || k.state) + (k.queued ? ` · ${k.queued}` : '');
  b.title = k.message || ('Python kernel — ' + (KLABEL[k.state] || k.state) + (k.state === 'stopped' || k.state === 'dead' ? ' (click to start)' : ''));
  $('#tKill').disabled = k.state === 'stopped';
}
async function refreshKernel() { if (!S.ws) return; try { applyKernel(await api(wsUrl('kernel'))); } catch (e) { /* ignore */ } }
async function interrupt() { try { applyKernel(await api(wsUrl('kernel/interrupt'), J('POST', {}))); } catch (e) { fail(e); } }
async function restartKernel() {
  try {
    for (const [k, p] of [...S.polls]) { p.cell.status = 'idle'; setGutter(p.cell); S.polls.delete(k); }
    renderTabs(); applyKernel({ state: 'starting', queued: 0 });
    applyKernel(await api(wsUrl('kernel/restart'), J('POST', {})));
  } catch (e) { fail(e); }
}
$('#kbadge').onclick = async () => { if (S.kernel.state === 'stopped' || S.kernel.state === 'dead') { applyKernel({ state: 'starting', queued: 0 }); try { applyKernel(await api(wsUrl('kernel/start'), J('POST', {}))); } catch (e) { fail(e); } } };
$('#tKill').onclick = async () => { if (confirm('Shut down the kernel? Variables in memory are lost (files are kept).')) { try { applyKernel(await api(wsUrl('kernel/shutdown'), J('POST', {}))); } catch (e) { fail(e); } } };
setInterval(() => { if (S.cur && S.cur.type === 'nb' && !document.hidden) refreshKernel(); }, 4000);

// ---- toolbar -----------------------------------------------------------------------------------------------------
function syncToolbar() {
  const d = S.cur; if (!d) return;
  if (d.type === 'nb') {
    const c = activeCell(d);
    $('#tCode').classList.toggle('on', !!c && c.cell_type === 'code'); $('#tMd').classList.toggle('on', !!c && c.cell_type === 'markdown');
  }
}
$('#tSave').onclick = () => S.cur && saveDoc(S.cur).then(() => toast('Saved')).catch(fail);
$('#tSaveTxt').onclick = () => S.cur && saveText(S.cur);
$('#tDlTxt').onclick = () => S.cur && download(S.cur.path, false);
$('#tAdd').onclick = () => { const d = S.cur; if (d && d.type === 'nb') insertCell(d, d.cells.indexOf(activeCell(d)) + 1, 'code'); };
$('#tRun').onclick = () => { const d = S.cur; if (!d || d.type !== 'nb') return; const c = activeCell(d), i = d.cells.indexOf(c); runCell(c); focusCell(d.cells[i + 1] || insertCell(d, i + 1, 'code', true), false); };
$('#tInt').onclick = interrupt;
$('#tRestart').onclick = () => confirm('Restart the kernel? Variables in memory are lost (files are kept).') && restartKernel();
$('#tRunAll').onclick = () => S.cur && runAll(S.cur);
$('#tRestartAll').onclick = async () => { if (S.cur) { await restartKernel(); await runAll(S.cur); } };
$('#tCode').onclick = () => { const d = S.cur; if (d) setType(d, activeCell(d), 'code'); };
$('#tMd').onclick = () => { const d = S.cur; if (d) setType(d, activeCell(d), 'markdown'); };
$('#tClear').onclick = () => { const d = S.cur; if (!d) return; for (const c of d.cells) { c.outputs = []; c.execution_count = null; renderOut(c); setGutter(c); } markDirty(d); };
$('#tDl').onclick = async () => { const d = S.cur; if (d) { await saveDoc(d).catch(() => {}); download(d.path, false); } };

// ---- saving ------------------------------------------------------------------------------------------------------
function markDirty(doc) {
  if (!doc || doc.type !== 'nb') return;
  if (!doc.dirty) { doc.dirty = true; renderTabs(); }
  clearTimeout(doc.saveT); doc.saveT = setTimeout(() => saveDoc(doc).catch(fail), 1500);
}
async function saveDoc(doc) {
  if (doc.type === 'text') return saveText(doc);
  clearTimeout(doc.saveT);
  const cells = doc.cells.map(c => ({ id: c.id, cell_type: c.cell_type, source: c.source, outputs: c.cell_type === 'code' ? c.outputs || [] : [], execution_count: c.execution_count ?? null }));
  doc.dirty = false; renderTabs();
  try {
    const r = await api(wsUrl('notebook?path=' + q(doc.path)), J('PUT', { cells, metadata: doc.metadata || {} }));
    doc.mtime = r.mtime;
  } catch (e) { doc.dirty = true; renderTabs(); throw e; }
}
async function saveText(doc) {
  try { await api(wsUrl('files/content?path=' + q(doc.path)), J('PUT', { content: doc.ta.value })); doc.dirty = false; renderTabs(); toast('Saved'); loadFiles().catch(() => {}); } catch (e) { fail(e); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) for (const d of S.docs) if (d.type === 'nb' && d.dirty) saveDoc(d).catch(() => {}); });
addEventListener('beforeunload', () => { for (const d of S.docs) if (d.type === 'nb' && d.dirty) saveDoc(d).catch(() => {}); });
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (S.cur) saveDoc(S.cur).then(() => toast('Saved')).catch(fail); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); ui.side = ui.side === false; if (ui.rail === false) ui.rail = true; saveUi(); applyLayout(); }
});

// ---- packages ----------------------------------------------------------------------------------------------------
async function loadPackages() {
  if (!S.ws) return;
  const d = await api(wsUrl('packages'));
  const box = $('#pkgs'); box.innerHTML = '';
  for (const p of d.packages) box.append(h('span', { class: 'chip' }, p.name, h('i', {}, p.version)));
  if (d.install && d.install.status === 'running') followInstall(d.install.id);
}
let instT = null;
async function followInstall(id) {
  const log = $('#pkglog'); log.hidden = false; $('#bInstall').disabled = true;
  $('#bInstall').firstChild.replaceWith(h('span', { class: 'spin' }, ic('loader')));
  let v = -1;
  clearInterval(instT);
  const done = () => { clearInterval(instT); $('#bInstall').disabled = false; $('#bInstall').firstChild.replaceWith(ic('download')); };
  instT = setInterval(async () => {
    try {
      const r = await api(wsUrl(`installs/${id}?v=${v}`)); v = r.version;
      if (r.text != null) { log.textContent = r.text; log.scrollTop = log.scrollHeight; }
      if (r.status !== 'running') {
        done(); loadPackages().catch(() => {}); loadWorkspaces(S.ws).catch(() => {});
        toast(r.status === 'ok' ? 'Installed — restart the kernel if the package was already imported.' : 'Install failed — see the log.');
      }
    } catch (e) { done(); }
  }, 800);
}
$('#bInstall').onclick = async () => {
  const spec = $('#pkgIn').value.trim(); if (!spec || !S.ws) return;
  try { const r = await api(wsUrl('packages/install'), J('POST', { spec: spec.replace(/,/g, ' ') })); $('#pkglog').textContent = ''; followInstall(r.id); } catch (e) { fail(e); }
};
$('#pkgIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#bInstall').click(); });
$('#bReset').onclick = async () => {
  if (!S.ws || !confirm('Remove every package installed in this workspace and stop its kernel? Your files stay.')) return;
  try { await api(wsUrl('reset-env'), J('POST', {})); $('#pkglog').hidden = true; await loadPackages(); await refreshKernel(); await loadWorkspaces(S.ws); toast('Packages removed.'); } catch (e) { fail(e); }
};

// ---- start -------------------------------------------------------------------------------------------------------
renderEmpty();
(async () => { try { await loadWorkspaces(); await openWorkspace(); } catch (e) { fail(e); activate(null); } })();
</script>
