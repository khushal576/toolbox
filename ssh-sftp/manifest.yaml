# Plugin manifest — spec: docs/architecture/plugin-manifest.md
# Connection cache + job registry in memory, history in SQLite.
schema_version: 1
name: ssh-sftp
title: SSH & SFTP
description: Live terminal (log in once, keep typing), browse, upload, download and run commands on servers saved in the Vault — host keys are pinned, uploads are verified and resumable, a server can be saved read-only
icon: 🔐
category: tool
kind: python
entry: ssh_sftp.server:app
runtime: ssh
tier: 4
state: [session, durable, jobs]
depends_on: [vault]
requires: []
order: 190
vault: {read: [ssh_server], write: [ssh_server]}   # Vault scope (roadmap B7): servers; write = pin host keys
resources: {cpu: 1.0, memory_mb: 512}   # roadmap C3: limit of the on-demand rt-ssh container (uploads/commands run in the worker)
