# Plugin manifest — spec: docs/architecture/plugin-manifest.md
schema_version: 1
name: data-lake
title: Vault Data loader
description: Backend of Vault → Vault Data (Load files + SQL tabs) — no page of its own; loads files into Vault Data tables as Parquet
icon: 📦
category: tool
hidden: true            # L6: its page moved into Vault → Vault Data; the API stays mounted here
kind: python
entry: data_lake.server:app
runtime: data
tier: 3
state: [durable, jobs]
depends_on: [vault]
requires: [duckdb]
order: 155
vault: {data: write, read: [postgres_connection, s3_location]}   # L1/L2: writes Vault Data tables; L4: DB connections to stage; L5: S3 locations
