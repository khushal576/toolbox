<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Sheet</title>
<link rel="icon" href="data:," />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f6fb; --surface: #ffffff; --border: #dde1ef;
    --text: #1c2035; --muted: #6b7180; --accent: #4f5ef0;
    --err-bg: rgba(220,38,38,0.07); --err-text: #b91c1c; --err-border: rgba(220,38,38,0.35);
    --ok-bg: rgba(21,128,61,0.08); --ok-text: #15803d;
    --warn-bg: rgba(217,119,6,0.09); --warn-text: #b45309;
    --dirty: #fff6d6; --newrow: #eaf7ee; --grid: #e6e9f3; --head: #f0f2fa;
  }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px;
         display: flex; flex-direction: column; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---- toolbar ---- */
  .bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border);
         flex-wrap: wrap; }
  .bar h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.3px; margin-right: 6px; }
  .bar h1 span { color: var(--accent); }
  .sheetname { color: var(--muted); font-size: 0.82rem; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 6px; }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  .btn.danger { color: var(--err-text); }
  .search { border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; width: 190px; background: var(--bg); font-size: 0.82rem; }
  .spacer { flex: 1; }
  .menuwrap { position: relative; display: inline-block; }
  .dd { position: absolute; top: calc(100% + 4px); left: 0; z-index: 60; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
        box-shadow: 0 8px 24px rgba(20,24,60,0.16); min-width: 210px; padding: 4px; display: none; }
  .dd.open { display: block; }
  .dd button, .ctx button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 0.82rem; }
  .dd button:hover, .ctx button:hover { background: var(--bg); color: var(--accent); }
  .ctx hr, .dd hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
  .ctx { position: fixed; z-index: 80; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(20,24,60,0.18);
         min-width: 210px; padding: 4px; display: none; max-height: 80vh; overflow: auto; }
  .ctx .lbl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); padding: 5px 10px 2px; }

  /* ---- formula bar ---- */
  .fxbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
  #ref { width: 92px; text-align: center; border: 1px solid var(--border); border-radius: 5px; padding: 4px 6px; background: var(--bg); font-size: 0.8rem;
         font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden; white-space: nowrap; }
  .fxl { color: var(--accent); font-style: italic; font-weight: 700; }
  #fx { flex: 1; border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px; background: var(--surface);
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.82rem; min-width: 0; }
  #fx.err { border-color: var(--err-border); background: var(--err-bg); }
  #fx:disabled { background: var(--bg); }

  /* ---- grid ---- */
  .sheet { flex: 1; min-height: 0; display: grid; grid-template-columns: 52px minmax(0, 1fr); grid-template-rows: 46px minmax(0, 1fr); background: var(--surface); }
  .corner { background: var(--head); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: pointer; position: relative; z-index: 3; }
  .corner::after { content: ""; position: absolute; right: 6px; bottom: 6px; border: 6px solid transparent; border-right-color: #b8bdd2; border-bottom-color: #b8bdd2; }
  #colhead, #rowhead { overflow: hidden; position: relative; background: var(--head); user-select: none; }
  #colhead { border-bottom: 1px solid var(--border); }
  #rowhead { border-right: 1px solid var(--border); }
  #colhead .in, #rowhead .in { position: absolute; top: 0; left: 0; }
  .h { position: absolute; top: 0; height: 46px; border-right: 1px solid var(--grid); padding: 3px 22px 0 7px; cursor: default; overflow: hidden; }
  .h.on, .g.on { background: #dfe3fb; }
  .h .hl { font-size: 0.66rem; color: var(--muted); line-height: 1.1; }
  .h .hn { font-weight: 600; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
  .h .ht { font-size: 0.62rem; color: var(--muted); }
  .h .hf { color: var(--accent); font-weight: 700; }
  .h .hm { position: absolute; right: 7px; top: 4px; width: 16px; height: 16px; text-align: center; line-height: 14px; border-radius: 4px; cursor: pointer; color: var(--muted); }
  .h .hm:hover { background: var(--accent); color: #fff; }
  .h .hr { position: absolute; right: -3px; top: 0; width: 7px; height: 100%; cursor: col-resize; z-index: 2; }
  .g { position: absolute; left: 0; width: 52px; height: 26px; border-bottom: 1px solid var(--grid); text-align: center; line-height: 25px; font-size: 0.72rem;
       color: var(--muted); cursor: default; }
  .g.new { background: var(--newrow); color: var(--ok-text); font-weight: 700; }
  .g.on { color: var(--text); }
  #vp { overflow: auto; position: relative; outline: none; background: #fff; }
  #sizer { position: relative; }
  #rows { position: absolute; left: 0; top: 0; }
  .row { position: absolute; left: 0; height: 26px; }
  .c { position: absolute; top: 0; height: 100%; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 0 7px; line-height: 25px;
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: cell; }
  /* a wrapped column (header ⋮ → Wrap text): the cell shows its whole text over several lines; the row is as tall as its tallest wrapped cell */
  .c.w { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 40; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 17px;
         padding: 4px 7px; text-overflow: clip; }
  .g.w { line-height: 17px; padding-top: 4px; }
  .h .hw { color: var(--accent); font-weight: 700; }
  .c.r { text-align: right; }
  .c.ctr { text-align: center; }
  .c.d { background: var(--dirty); }
  .c.nr { background: var(--newrow); }
  .c.bad { background: var(--err-bg); box-shadow: inset 0 -2px 0 var(--err-border); }
  .c.fe { color: var(--err-text); font-weight: 600; }
  .c.fm { color: #3b44b8; }
  #selbox { position: absolute; pointer-events: none; border: 1px solid var(--accent); background: rgba(79,94,240,0.09); display: none; z-index: 2; }
  #actbox { position: absolute; pointer-events: none; border: 2px solid var(--accent); display: none; z-index: 3; }
  #fh { position: absolute; width: 8px; height: 8px; background: var(--accent); border: 1px solid #fff; cursor: crosshair; display: none; z-index: 4; }
  #fillprev { position: absolute; pointer-events: none; border: 2px dashed var(--accent); display: none; z-index: 3; }
  #ed { position: absolute; z-index: 5; display: none; border: 2px solid var(--accent); background: #fff; padding: 0 6px; font: inherit; outline: none; height: 26px; min-width: 60px; }
  #edw { position: absolute; z-index: 5; display: none; border: 2px solid var(--accent); background: #fff; padding: 4px 6px; font: inherit; line-height: 17px; outline: none;
         resize: none; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 60px; }

  .empty { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: var(--muted); padding: 24px; text-align: center; }
  .empty h2 { color: var(--text); font-size: 1.25rem; }
  .empty .opts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .empty .opts .btn { padding: 11px 18px; font-size: 0.9rem; }

  /* ---- sheet tabs (the workbook) ---- */
  #tabs { display: none; align-items: stretch; gap: 2px; padding: 4px 8px 0; background: var(--head); border-top: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; }
  .tab { border: 1px solid var(--border); border-bottom: none; border-radius: 7px 7px 0 0; background: #e4e7f5; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; white-space: nowrap;
         max-width: 220px; overflow: hidden; text-overflow: ellipsis; user-select: none; }
  .tab:hover { background: #eef0fb; }
  .tab.on { background: var(--surface); font-weight: 600; color: var(--accent); box-shadow: 0 2px 0 var(--surface); position: relative; top: 1px; }
  .tab .dot { color: var(--warn-text); font-weight: 700; margin-left: 4px; }
  .tab.add { background: none; border-color: transparent; font-weight: 700; color: var(--accent); padding: 4px 10px; }
  .tab.add:hover { background: #dfe3fb; }
  .tab input { font: inherit; width: 130px; border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; }

  /* ---- draft (autosave) + restore banner ---- */
  .draftstate { font-size: 0.74rem; color: var(--muted); white-space: nowrap; }
  .draftstate.bad { color: var(--err-text); cursor: pointer; text-decoration: underline; }
  .draftstate.pause { color: var(--warn-text); cursor: pointer; text-decoration: underline; }
  #restoreBar { display: none; align-items: center; gap: 10px; padding: 6px 12px; background: var(--ok-bg); color: var(--ok-text); border-bottom: 1px solid var(--border); font-size: 0.82rem; }
  #restoreBar button { border: 1px solid currentColor; background: none; color: inherit; border-radius: 5px; padding: 2px 9px; cursor: pointer; font-size: 0.78rem; }
  #restoreBar .x { margin-left: auto; border: none; font-size: 1rem; line-height: 1; }

  /* ---- status bar ---- */
  .status { display: flex; gap: 14px; align-items: center; padding: 5px 12px; background: var(--surface); border-top: 1px solid var(--border); font-size: 0.76rem; color: var(--muted); flex-wrap: wrap; }
  .status b { color: var(--text); font-weight: 600; }
  .status .warn { color: var(--warn-text); }
  .status .bad { color: var(--err-text); cursor: pointer; text-decoration: underline; }
  .status .ok { color: var(--ok-text); }

  /* ---- modal, find panel, toast ---- */
  .backdrop { position: fixed; inset: 0; background: rgba(20,24,50,0.4); z-index: 90; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; overflow: auto; }
  .modal { background: var(--surface); border-radius: 12px; box-shadow: 0 20px 60px rgba(20,24,60,0.35); width: min(560px, 100%); padding: 18px 20px; }
  .modal.wide { width: min(760px, 100%); }
  .modal h2 { font-size: 1.05rem; margin-bottom: 10px; }
  .modal .hint { color: var(--muted); font-size: 0.78rem; line-height: 1.5; margin: 6px 0; }
  .modal label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); margin: 10px 0 4px; }
  .modal input[type=text], .modal select, .modal textarea { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; background: var(--bg); }
  .modal textarea { min-height: 170px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; resize: vertical; }
  .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .chk { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 0.84rem; }
  .modal .chk label { margin: 0; text-transform: none; font-size: 0.84rem; letter-spacing: 0; color: var(--text); font-weight: 400; }
  .modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .msg { border-radius: 7px; padding: 8px 11px; font-size: 0.82rem; margin-top: 10px; }
  .msg.err { background: var(--err-bg); color: var(--err-text); border: 1px solid var(--err-border); }
  .msg.ok { background: var(--ok-bg); color: var(--ok-text); }
  .msg.warn { background: var(--warn-bg); color: var(--warn-text); }
  .pick { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 10px; margin-top: 8px; }
  .pick .list { border: 1px solid var(--border); border-radius: 8px; max-height: 300px; overflow: auto; }
  .pick .list div { padding: 7px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--grid); }
  .pick .list div:hover { background: var(--bg); }
  .pick .list div.on { background: #dfe3fb; font-weight: 600; }
  .pick .list .m { color: var(--muted); font-weight: 400; font-size: 0.76rem; }
  table.errs { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 8px; }
  table.errs th, table.errs td { text-align: left; padding: 5px 7px; border-bottom: 1px solid var(--grid); }
  table.errs th { font-size: 0.68rem; text-transform: uppercase; color: var(--muted); }
  table.errs tr.go { cursor: pointer; } table.errs tr.go:hover td { background: var(--bg); }
  #find { position: fixed; right: 18px; top: 98px; z-index: 70; width: 320px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
          box-shadow: 0 10px 30px rgba(20,24,60,0.22); padding: 12px 14px; display: none; }
  #find.open { display: block; }
  #find input[type=text] { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: var(--bg); margin-bottom: 6px; }
  #find .fr { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  #find .opt { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; margin-top: 4px; }
  #find .cnt { font-size: 0.76rem; color: var(--muted); margin-top: 6px; min-height: 1em; }
  #toast { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 100; background: #1c2035; color: #fff; border-radius: 8px; padding: 9px 16px;
           font-size: 0.84rem; display: none; max-width: min(640px, 92vw); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
  #toast.err { background: var(--err-text); }
  .sr { position: absolute; left: -9999px; }
</style>
</head>
<body>

<div class="bar" id="bar">
  <h1>Mini Sheet<span>.</span></h1>
  <span class="sheetname" id="sheetName">no sheet open</span>
  <div class="menuwrap">
    <button class="btn" id="btnOpen" aria-haspopup="true">Open ▾</button>
    <div class="dd" id="ddOpen">
      <button data-open="table">📦 Vault Data table…</button>
      <button data-open="paste">📋 Paste from Excel / Sheets…</button>
      <button data-open="file">📄 CSV / Excel / JSON file…</button>
      <button data-open="blank">▫ Blank sheet</button>
      <hr>
      <button data-open="close" id="miClose" disabled>✕ Close workbook</button>
    </div>
  </div>
  <button class="btn primary" id="btnSave" disabled title="Save this sheet to Vault Data (Ctrl+S)">💾 Save</button>
  <button class="btn" id="btnSaveAll" disabled title="Save every sheet to Vault Data, one table per sheet">💾 Save all sheets…</button>
  <div class="menuwrap">
    <button class="btn" id="btnDown" disabled aria-haspopup="true">Download ▾</button>
    <div class="dd" id="ddDown">
      <button data-down="xlsx">Excel (.xlsx) — all sheets</button>
      <button data-down="csv">CSV (.csv) — this sheet</button>
    </div>
  </div>
  <span class="sep"></span>
  <button class="btn" id="btnUndo" disabled title="Undo (Ctrl+Z)">↶ Undo</button>
  <button class="btn" id="btnRedo" disabled title="Redo (Ctrl+Y)">↷ Redo</button>
  <span class="sep"></span>
  <div class="menuwrap">
    <button class="btn" id="btnWrap" disabled aria-haspopup="true" title="Show long text over several lines (or turn it on for one column from the column's ⋮ menu)">↵ Wrap ▾</button>
    <div class="dd" id="ddWrap">
      <button data-wrap="all">Wrap text in every column</button>
      <button data-wrap="none">Stop wrapping in every column</button>
    </div>
  </div>
  <button class="btn" id="btnFind" disabled title="Find & replace (Ctrl+F)">🔍 Find &amp; replace</button>
  <input class="search" id="search" type="search" placeholder="Search rows…" disabled aria-label="Search rows" />
  <button class="btn" id="btnClearFilters" style="display:none" title="Remove every filter and the search">✕ Clear filters</button>
  <span class="spacer"></span>
  <span class="draftstate" id="draftState" title="Your work is kept in a draft, so a reload or a closed tab doesn't lose it (undo history is not kept)"></span>
</div>
<div id="restoreBar" role="status"><span id="restoreMsg"></span><button id="restoreDiscard" title="Throw the restored work away and start clean">Discard</button><button class="x" id="restoreClose" title="Hide this message" aria-label="Hide this message">✕</button></div>

<div class="fxbar">
  <div id="ref">–</div>
  <span class="fxl">fx</span>
  <input id="fx" type="text" disabled spellcheck="false" placeholder="Pick a cell — type text, a number, or a formula like =SUM(A1:A9)" aria-label="Cell content" />
</div>

<div id="emptyState" class="empty">
  <h2>🧮 Mini Sheet</h2>
  <p>A small spreadsheet for editing data by hand. Open something to start.</p>
  <div class="opts">
    <button class="btn primary" data-open="table">📦 Open a Vault Data table</button>
    <button class="btn" data-open="paste">📋 Paste from Excel</button>
    <button class="btn" data-open="file">📄 Open a file</button>
    <button class="btn" data-open="blank">▫ Blank sheet</button>
  </div>
  <p style="font-size:0.78rem;max-width:560px">For small data (up to 50,000 rows). Bigger files: load them with Vault → Vault Data → Load files.</p>
</div>

<div class="sheet" id="sheet" style="display:none">
  <div class="corner" id="corner" title="Select everything"></div>
  <div id="colhead"><div class="in" id="colin"></div></div>
  <div id="rowhead"><div class="in" id="rowin"></div></div>
  <div id="vp" tabindex="0" aria-label="Sheet">
    <div id="sizer">
      <div id="rows"></div>
      <div id="selbox"></div><div id="actbox"></div><div id="fillprev"></div><div id="fh"></div>
      <input id="ed" type="text" spellcheck="false" aria-label="Edit cell" />
      <textarea id="edw" spellcheck="false" aria-label="Edit cell (wrapped text)" rows="1"></textarea>
    </div>
  </div>
</div>

<div id="tabs" role="tablist" aria-label="Sheets"></div>

<div class="status" id="status"><span id="stDims">–</span><span id="stSel"></span><span class="spacer"></span><span id="stDirty"></span></div>

<div class="ctx" id="ctx"></div>
<div id="find">
  <b style="font-size:0.84rem">Find &amp; replace</b>
  <input type="text" id="fFind" placeholder="Find" style="margin-top:8px" />
  <input type="text" id="fRepl" placeholder="Replace with" />
  <label class="opt"><input type="checkbox" id="fCase" /> Match case</label>
  <label class="opt"><input type="checkbox" id="fWhole" /> Whole cell only</label>
  <label class="opt"><input type="checkbox" id="fSel" /> Only in the selected cells</label>
  <label class="opt"><input type="checkbox" id="fForm" /> Also look inside formulas</label>
  <div class="fr">
    <button class="btn" id="fPrev">◀ Previous</button><button class="btn" id="fNext">Next ▶</button>
    <button class="btn" id="fOne">Replace</button><button class="btn" id="fAll">Replace all</button>
    <button class="btn" id="fClose">Close</button>
  </div>
  <div class="cnt" id="fCnt"></div>
</div>
<div id="toast" role="status"></div>

<script src="formula.js"></script>
<script src="wrap.js"></script>
<script>
(function () {
  "use strict";
  const F = window.MSFormula, WR = window.MSWrap;
  const $ = (id) => document.getElementById(id);
  const MINW = 48, RH_MIN = 26, LH = 17, SAFE = 9007199254740991, MAXUNDO = 300;
  const KIND_LABEL = { text: "text", integer: "whole number", number: "number", date: "date", datetime: "date & time", boolean: "yes/no" };
  const KIND_TAG = { text: "text", integer: "int", number: "num", date: "date", datetime: "date+time", boolean: "yes/no" };
  let LIMITS = { max_rows: 50000, max_cols: 200, max_cells: 5000000, max_upload_mb: 25, max_sheets: 50, sheet_name_max: 31, draft_max_mb: 40 };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const NUMRE = /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/;
  let toastTimer = null;
  function toast(msg, isErr) {
    const t = $("toast"); t.textContent = msg; t.className = isErr ? "err" : ""; t.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, isErr ? 6000 : 3000);
  }
  async function api(path, opts) {
    const r = await fetch(path, opts);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || j.detail || ("HTTP " + r.status)); e.status = r.status; e.body = j; throw e; }
    return j;
  }
  const postJSON = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

  // ======================================================================================================= state
  let W = null;                    // the open workbook { name, sheets: [sheet…], active }, or null
  let S = null;                    // the ACTIVE sheet (W.sheets[W.active]), or null — nearly everything below works on S
  /* sheet = { id, name, cols:[{id,name,kind,sql,w,wrap}], rows:[{id,v:[],h,ex}], nextRid, nextCid, origRows:Map, origColIdx:Map, origin,

      else exec(cmdSet(fillItems({ r0, r1: r0, c0, c1 }, { r0: r0 + 1, r1, c0, c1 }, true, false)));
    } else {
      if (c0 === c1) { if (c0 === 0) return; exec(cmdSet(fillItems({ r0, r1, c0: c0 - 1, c1: c0 - 1 }, { r0, r1, c0, c1: c0 }, false, false))); }
      else exec(cmdSet(fillItems({ r0, r1, c0, c1: c0 }, { r0, r1, c0: c0 + 1, c1 }, false, false)));
    }
  }

  // ======================================================================================================= rows / columns / sort / filter
  function selectedRows() { const { r0, r1 } = rng(); const out = []; for (let r = r0; r <= r1; r++) out.push(dataIdxOf(r)); return out; }
  function selectedCols() { const { c0, c1 } = rng(); const out = []; for (let c = c0; c <= c1; c++) out.push(c); return out; }
  function insertRows(below) {
    const idxs = selectedRows(), n = Math.max(1, idxs.length);
    if (S.rows.length + n > LIMITS.max_rows) { toast("That would go over " + LIMITS.max_rows.toLocaleString() + " rows.", true); return; }
    const at = below ? idxs[idxs.length - 1] + 1 : idxs[0];
    const rows = []; for (let i = 0; i < n; i++) rows.push(newRowObj());
    exec(cmdInsertRows(at, rows));
    const r = Math.max(0, S.view.indexOf(at)); select(r, S.sel.cc, r + n - 1, S.sel.cc); schedule();
  }
  function deleteRows() {
    const idxs = selectedRows();
    if (!idxs.length) return;
    if (idxs.length === S.rows.length && !confirm("Delete every row?")) return;
    exec(cmdDeleteRows(idxs));
    toast("Deleted " + idxs.length.toLocaleString() + " row(s) — Ctrl+Z brings them back");
  }
  function insertCols(right) {
    const cs = selectedCols(), n = cs.length;
    if (S.cols.length + n > LIMITS.max_cols) { toast("That would go over " + LIMITS.max_cols + " columns.", true); return; }
    const at = right ? cs[cs.length - 1] + 1 : cs[0];
    const add = []; for (let i = 0; i < n; i++) add.push(newColObj(uniqueName("column_" + (S.cols.length + 1 + i)), "text"));
    exec(cmdInsertCols(at, add));
    select(S.sel.ar, at, S.sel.cr, at + n - 1);
  }
  function deleteCols() {
    const cs = selectedCols();
    if (cs.length >= S.cols.length) { toast("A sheet needs at least one column.", true); return; }
    exec(cmdDeleteCols(cs));
    toast("Deleted " + cs.length + " column(s) — Ctrl+Z brings them back");
  }
  function moveCol(delta) {
    const cs = selectedCols();
    if (cs.length !== 1) { toast("Select one column to move it."); return; }
    const to = cs[0] + delta;
    if (to < 0 || to >= S.cols.length) return;
    exec(cmdMoveCol(cs[0], to));
    select(S.sel.ar, to, S.sel.cr, to);
  }
  async function renameCol(ci) {
    const col = S.cols[ci];
    const name = await askText("Rename column", "New name", col.name);
    if (name === null) return;
    const n = name.trim();
    if (!n) { toast("A column needs a name.", true); return; }
    if (n.length > 128) { toast("That name is too long.", true); return; }
    if (S.cols.some((c, i) => i !== ci && c.name.toLowerCase() === n.toLowerCase())) { toast("Another column is already called “" + n + "”.", true); return; }
    exec(cmdProp(col, "name", n, true));
  }
  function setKind(ci, kind) {
    const col = S.cols[ci];
    if (col.kind === kind) return;
    const makers = [() => ({ struct: true, redo() { col.kind = kind; col.sql = ""; }, undo() { col.kind = oldK; col.sql = oldS; } })];
    const oldK = col.kind, oldS = col.sql;
    makers.push(() => {                          // re-read every plain value as the new type (formulas stay formulas)
      const items = [];
      for (const row of S.rows) { const v = row.v[ci]; if (v !== null && v !== undefined && v !== "" && !isF(v)) items.push([row, ci, parseInput(rawText(v), col)]); }
      return cmdSet(items);
    });
    exec(batch(makers));
    const bad = S.rows.filter((row, i) => { const v = row.v[ci]; return v !== null && v !== undefined && v !== "" && problem(col, isF(v) ? valueAt(i, ci) : v); }).length;
    toast("“" + col.name + "” is now " + KIND_LABEL[kind] + (bad ? " — " + bad.toLocaleString() + " value(s) don't fit (shown in red)" : ""), !!bad);
  }
  function sortCol(ci, asc) {
    const keys = S.rows.map((row, i) => { const v = valueAt(i, ci); return { row, v, empty: v === null || v === "" }; });
    const num = (v) => (typeof v === "number" ? v : (typeof v === "string" && NUMRE.test(v.trim()) ? Number(v) : null));
    keys.sort((a, b) => {
      if (a.empty || b.empty) return a.empty === b.empty ? 0 : (a.empty ? 1 : -1);      // blanks always last
      const x = num(a.v), y = num(b.v);
      const c = (x !== null && y !== null) ? x - y : display(a.v).localeCompare(display(b.v), undefined, { numeric: true, sensitivity: "base" });
      return asc ? c : -c;
    });
    exec(cmdOrder(keys.map((k) => k.row)));
    toast("Sorted by “" + S.cols[ci].name + "” " + (asc ? "A → Z" : "Z → A") + " — rows moved; Ctrl+Z puts them back");
  }
  async function filterCol(ci) {
    const col = S.cols[ci];
    const v = await askText("Filter “" + col.name + "”", "Show only rows where this column…", S.filters.get(col.id) || "",
      "Type text to find (contains), or: =value · !value · >5 · >=5 · <5 · <=5 · empty · nonempty. Leave empty to remove the filter.");
    if (v === null) return;
    if (v.trim()) S.filters.set(col.id, v); else S.filters.delete(col.id);
    rebuildView(); select(Math.min(S.sel.cr, Math.max(0, S.view.length - 1)), S.sel.cc); schedule(); scheduleStats(); touchDraft();
  }
  function clearFilters() { S.filters.clear(); S.search = ""; $("search").value = ""; rebuildView(); schedule(); scheduleStats(); touchDraft(); }

  // ======================================================================================================= find & replace
  let findPos = -1;
  function findMatcher() {
    const q = $("fFind").value;
    if (!q) return null;
    const cs = $("fCase").checked, whole = $("fWhole").checked, inForm = $("fForm").checked;
    const needle = cs ? q : q.toLowerCase();
    return (raw, shown) => {
      const text = isF(raw) ? (inForm ? raw : shown) : shown;
      const hay = cs ? text : text.toLowerCase();
      return whole ? hay === needle : hay.indexOf(needle) >= 0;
    };
  }
  function* cellsInScope() {
    const only = $("fSel").checked, { r0, r1, c0, c1 } = rng();
    const ra = only ? r0 : 0, rb = only ? r1 : S.view.length - 1, ca = only ? c0 : 0, cb = only ? c1 : S.cols.length - 1;
    for (let r = ra; r <= rb; r++) for (let c = ca; c <= cb; c++) yield [r, c];
  }
  function matches() {
    const m = findMatcher(), out = [];
    if (!m) return out;
    for (const [r, c] of cellsInScope()) { const dr = S.view[r], raw = S.rows[dr].v[c]; if (m(raw, display(valueAt(dr, c)))) out.push([r, c]); }
    return out;
  }
  function findStep(dir) {
    const list = matches();
    $("fCnt").textContent = list.length ? list.length.toLocaleString() + " match(es)" : ($("fFind").value ? "No matches" : "");
    if (!list.length) return;
    const cur = S.sel.cr * 100000 + S.sel.cc;
    let pick;
    if (dir > 0) pick = list.find(([r, c]) => r * 100000 + c > cur) || list[0];
    else pick = [...list].reverse().find(([r, c]) => r * 100000 + c < cur) || list[list.length - 1];
    select(pick[0], pick[1], pick[0], pick[1]); schedule();
  }
  function replaceText(raw, shown) {
    const q = $("fFind").value, rep = $("fRepl").value, cs = $("fCase").checked, whole = $("fWhole").checked;
    const base = isF(raw) ? raw : shown;
    if (whole) return rep;
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), cs ? "g" : "gi");
    return base.replace(re, () => rep);
  }
  function replaceCells(list) {
    const m = findMatcher(); if (!m || !list.length) return 0;
    const items = [];
    for (const [r, c] of list) {
      const dr = S.view[r], row = S.rows[dr], raw = row.v[c];
      if (isF(raw) && !$("fForm").checked) continue;                       // a formula's result isn't text you can replace
      items.push([row, c, parseInput(replaceText(raw, display(valueAt(dr, c))), S.cols[c])]);
    }
    const cmd = cmdSet(items);
    if (cmd) exec(cmd);
    return items.length;
  }
  function openFind() {
    $("find").classList.add("open");
    const { r0, r1, c0, c1 } = rng();
    if (r0 === r1 && c0 === c1 && S.view.length) { const t = display(valueAt(dataIdxOf(r0), c0)); if (t && t.length < 60 && !$("fFind").value) $("fFind").value = t; }
    $("fFind").focus(); $("fFind").select();
    $("fCnt").textContent = $("fFind").value ? matches().length.toLocaleString() + " match(es)" : "";
  }

  // ======================================================================================================= modals

    document.body.appendChild(bd);

        '<div class="acts"><button class="btn" id="mc">Cancel</button><button class="btn primary" id="mo">OK</button></div>');

    '<div><input type="radio" name="om" id="omRep" value="replace" /> <label for="omRep">Replace the whole workbook</label></div></div>';

  // ---- save
  function sheetPayload(sh) {                    // computed values, one array per row; errs = formulas that show an error
    sh = sh || S;
    const rows = [], errs = [];
    for (let i = 0; i < sh.rows.length; i++) {
      const out = new Array(sh.cols.length);
      for (let c = 0; c < sh.cols.length; c++) {
        const raw = sh.rows[i].v[c];
        let v = raw === undefined ? null : raw;
        if (isF(raw)) {
          v = valueAtIn(sh, i, c);
          if (v instanceof F.FErr) { if (errs.length < 8) errs.push(F.colToLetters(c) + (i + 1) + " " + v.code); v = null; }
          else if (typeof v === "number") v = Number(F.fmtNum(v));
        }
        out[c] = v;
      }
      rows.push(out);
    }
    return { rows, errs, columns: sh.cols.map((c) => ({ name: c.name, kind: c.kind, sql_type: c.sql })) };
  }

  async function download(fmt) {

  function serializeSheet(sh) {

      cols: sh.cols.map((c) => ({ id: c.id, name: c.name, kind: c.kind, sql: c.sql, w: c.w, wrap: c.wrap ? 1 : 0 })),
